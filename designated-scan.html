<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫描打印系统 — 指定作业扫描</title>
<style>
  :root {
    /* ============================================================
       Primary — brand / interaction (buttons, links, selected)
       ============================================================ */
    --color-primary-50:  #effafa;
    --color-primary-100: #def8f9;
    --color-primary-200: #b2f1f2;
    --color-primary-300: #7de3e6;
    --color-primary-500: #50d8dc;
    --color-primary-700: #00a6ab;
    --color-primary-950: #007a7e;

    /* ============================================================
       Gray — text / border / background hierarchy
       ============================================================ */
    --color-gray-50:  #f8f8fc;
    --color-gray-100: #d2d3de;
    --color-gray-200: #bcbdc0;
    --color-gray-300: #a2a3a6;
    --color-gray-400: #88898c;
    --color-gray-500: #6e6f71;
    --color-gray-600: #545557;
    --color-gray-700: #3a3b3d;
    --color-gray-900: #212123;

    /* ============================================================
       Base — pure black / white
       ============================================================ */
    --color-base-01: #000000;
    --color-base-02: #ffffff;

    /* ============================================================
       Semantic — Success
       ============================================================ */
    --color-success-100: #bef8fa;
    --color-success-300: #66dade;
    --color-success-500: #11c5ca;
    --color-success-700: #00a6ab;
    --color-success-900: #008a8f;

    /* ============================================================
       Semantic — Error
       ============================================================ */
    --color-error-100: #ffece8;
    --color-error-300: #fdcdc5;
    --color-error-500: #fbaca3;
    --color-error-700: #f53f3f;
    --color-error-900: #cb2634;

    /* ============================================================
       Semantic — Warning
       ============================================================ */
    --color-warning-100: #fff7e8;
    --color-warning-300: #ffe4ba;
    --color-warning-500: #ffcf8b;
    --color-warning-700: #ff7d00;
    --color-warning-900: #d25f00;

    /* ============================================================
       Semantic — Info
       ============================================================ */
    --color-info-100: #e4f0fb;
    --color-info-300: #97c4f1;
    --color-info-500: #3089e3;
    --color-info-700: #2675c4;
    --color-info-900: #185695;

    /* ============================================================
       Accent — classification / data-viz only (NOT interaction)
       ============================================================ */
    --color-accent-1-50:  #d2f0e1;
    --color-accent-1-400: #a7eaca;
    --color-accent-1-600: #5ad0a3;
    --color-accent-1-800: #049d75;
    --color-accent-2-50:  #fff1f7;
    --color-accent-2-400: #fbcde4;
    --color-accent-2-600: #ff86c8;
    --color-accent-2-800: #d14692;
    --color-accent-3-50:  #f3f1ff;
    --color-accent-3-400: #cfc6ff;
    --color-accent-3-600: #8b6ff2;
    --color-accent-3-800: #5936b1;
    --color-accent-4-50:  #fff9e7;
    --color-accent-4-400: #ffeeb6;
    --color-accent-4-600: #f9b932;
    --color-accent-4-800: #c27b00;

    /* ============================================================
       Overlay — only source of transparency
       alpha-2 = dark overlay  /  alpha-1 = light overlay
       ============================================================ */
    --color-overlay-alpha-2-04: rgba(19,19,21, .04);
    --color-overlay-alpha-2-05: rgba(19,19,21, .05);
    --color-overlay-alpha-2-06: rgba(19,19,21, .06);
    --color-overlay-alpha-2-08: rgba(19,19,21, .08);
    --color-overlay-alpha-2-10: rgba(19,19,21, .1);
    --color-overlay-alpha-2-12: rgba(19,19,21, .12);
    --color-overlay-alpha-2-20: rgba(19,19,21, .2);
    --color-overlay-alpha-2-30: rgba(19,19,21, .3);
    --color-overlay-alpha-2-40: rgba(19,19,21, .4);
    --color-overlay-alpha-2-50: rgba(19,19,21, .5);
    --color-overlay-alpha-2-60: rgba(19,19,21, .6);

    --color-overlay-alpha-1-08: rgba(255,255,255, .08);
    --color-overlay-alpha-1-14: rgba(255,255,255, .14);
    --color-overlay-alpha-1-15: rgba(255,255,255, .15);
    --color-overlay-alpha-1-40: rgba(255,255,255, .4);
    --color-overlay-alpha-1-65: rgba(255,255,255, .65);
    --color-overlay-alpha-1-75: rgba(255,255,255, .75);

    /* ============================================================
       Legacy aliases — map to new tokens for compatibility
       ============================================================ */
    --bg-primary:    var(--color-primary-50);
    --bg-card:       var(--color-base-02);
    --bg-header:     var(--color-primary-950);
    --bg-select-card:var(--color-primary-50);
    --text-primary:  var(--color-gray-900);
    --text-secondary:var(--color-gray-500);
    --text-muted:    var(--color-gray-400);
    --border:        var(--color-gray-100);
    --border-active: var(--color-primary-700);
    --accent:        var(--color-primary-700);
    --accent-dark:   var(--color-primary-950);
    --accent-light:  var(--color-primary-100);
    --accent-glow:   var(--color-overlay-alpha-2-12);
    --success:       var(--color-success-700);
    --success-bg:    var(--color-success-100);
    --warning:       var(--color-warning-700);
    --warning-bg:    var(--color-warning-100);
    --danger:        var(--color-error-700);

    /* Subject classification → accent tokens */
    --color-math:       var(--color-accent-1-800);
    --color-math-bg:    var(--color-accent-1-50);
    --color-english:    var(--color-accent-3-800);
    --color-english-bg: var(--color-accent-3-50);
    --color-chinese:    var(--color-accent-4-800);
    --color-chinese-bg: var(--color-accent-4-50);
    --color-physics:    var(--color-accent-1-600);
    --color-physics-bg: var(--color-accent-1-50);

    /* ============================================================
       Shadows — built from overlay tokens
       ============================================================ */
    --shadow-sm: 0 1px 2px var(--color-overlay-alpha-2-04);
    --shadow:    0 1px 3px var(--color-overlay-alpha-2-06), 0 1px 2px var(--color-overlay-alpha-2-04);
    --shadow-md: 0 4px 12px var(--color-overlay-alpha-2-06), 0 2px 4px var(--color-overlay-alpha-2-04);
    --shadow-lg: 0 12px 32px var(--color-overlay-alpha-2-08), 0 4px 8px var(--color-overlay-alpha-2-04);

    /* ============================================================
       Border-radius — spec: sm=6 md=8 lg=10 xl=28 full=9999
       ============================================================ */
    --radius-sm:   6px;
    --radius-md:   8px;
    --radius:      10px;
    --radius-lg:   10px;
    --radius-xl:   28px;
    --radius-full: 9999px;

    /* ============================================================
       Typography
       ============================================================ */
    --font-display: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    --font-body:    'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    --transition:      180ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-slow: 280ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--color-gray-50);
    background-image:
      radial-gradient(ellipse at 20% 20%, var(--color-overlay-alpha-2-05) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 60%, var(--color-overlay-alpha-2-04) 0%, transparent 50%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .app-window {
    width: 1500px; max-width: 100%;
    background: var(--bg-primary);
    border-radius: var(--radius-xl);
    box-shadow: 0 0 0 1px var(--color-overlay-alpha-2-06), 0 24px 64px var(--color-overlay-alpha-2-12), 0 8px 24px var(--color-overlay-alpha-2-08);
    overflow: hidden; display: flex; flex-direction: column;
  }

  .title-bar{
    height:32px;background:var(--color-primary-950);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;user-select:none;
  }
  .title-bar__dots{display:flex;gap:7px;}
  .title-bar__dot{width:11px;height:11px;border-radius:50%;opacity:0.85;}
  .title-bar__dot--close{background:var(--color-error-700);}
  .title-bar__dot--min{background:var(--color-warning-700);}
  .title-bar__dot--max{background:var(--color-success-700);}
  .title-bar__title{flex:1;text-align:center;color:var(--color-overlay-alpha-1-65);font-size:12px;letter-spacing:0.3px;}

  .header{
    background:var(--bg-header);padding:0 24px;height:58px;display:flex;align-items:center;
    gap:16px;flex-shrink:0;position:relative;z-index:2;
  }
  .header::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,var(--color-overlay-alpha-1-08) 0%,var(--color-overlay-alpha-1-14) 30%,var(--color-overlay-alpha-1-08) 100%);
  }
  .header__back{
    display:flex;align-items:center;gap:6px;color:var(--color-overlay-alpha-1-75);
    font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;
    padding:4px 8px;border-radius:var(--radius-sm);margin-left:-8px;transition:color var(--transition);
  }
  .header__back:hover{color:var(--color-base-02);background:var(--color-overlay-alpha-1-08);}
  .header__back svg{width:16px;height:16px;opacity:0.8;}
  .header__breadcrumb{color:var(--color-overlay-alpha-1-40);font-size:13px;margin:0 2px;}
  .header__page-title{color:var(--color-base-02);font-size:16px;font-weight:600;font-family:var(--font-display);letter-spacing:0.5px;flex:1;margin-left:4px;}

  .main-content{display:flex;gap:0;flex:1;min-height:480px;}

  .left-panel{flex:1;padding:24px 24px 16px 24px;display:flex;flex-direction:column;gap:12px;}
  .section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);margin-bottom:4px;}

  .selection-group{
    background:var(--bg-card);border-radius:var(--radius-lg);padding:16px 16px;
    box-shadow:var(--shadow-sm);border:1px solid var(--border);
    transition:border-color var(--transition),box-shadow var(--transition);
  }
  .selection-group__header{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
    font-size:13px;font-weight:600;color:var(--text-primary);
  }
  .selection-group__header .step-dot{
    width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;
  }
  .selection-group__header .step-dot--done{background:var(--success);}

  .selection-cards{display:flex;gap:8px;flex-wrap:wrap;}
  .selection-card{
    padding:8px 16px;background:var(--bg-select-card);
    border:1.5px solid var(--border);border-radius:var(--radius);
    cursor:pointer;transition:all var(--transition-slow);font-size:13px;
    color:var(--text-primary);user-select:none;min-width:64px;
    text-align:center;font-weight:500;
  }
  .selection-card:hover{
    border-color:var(--color-primary-300);background:var(--color-primary-50);transform:translateY(-1px);box-shadow:var(--shadow-md);
  }
  .selection-card:active{transform:scale(0.97);}
  .selection-card--selected{
    background:var(--accent-light);border-color:var(--border-active);
    color:var(--accent);font-weight:600;box-shadow:0 0 0 3px var(--accent-glow);
    position:relative;
  }
  .selection-card--selected::after{
    content:'';position:absolute;top:-1px;right:-1px;
    width:20px;height:20px;background:var(--accent);
    border-radius:0 var(--radius) 0 var(--radius);
  }
  .selection-card--selected::before{
    content:'';position:absolute;top:3px;right:4px;
    width:8px;height:4px;border-left:2px solid var(--color-base-02);
    border-bottom:2px solid var(--color-base-02);transform:rotate(-45deg);z-index:1;
  }
  .selection-card--disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;background:var(--color-gray-50);}

  .auto-selected-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;background:var(--color-primary-100);border:1px solid var(--color-primary-300);
    border-radius:var(--radius-full);font-size:12px;color:var(--color-primary-950);font-weight:500;
  }
  .auto-selected-badge__dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}

  /* Workbook compact list rows */
  .wb-list{display:flex;flex-direction:column;gap:1px;}
  .wb-list-row{
    display:flex;align-items:center;gap:8px;
    padding:8px 12px;cursor:pointer;user-select:none;
    border-radius:var(--radius-sm);transition:all var(--transition);
    border:1.5px solid transparent;
  }
  .wb-list-row:hover{background:var(--color-primary-50);border-color:var(--color-primary-100);}
  .wb-list-row--selected{
    background:var(--accent-light);border-color:var(--accent);
  }
  .wb-list-row__icon{
    width:28px;height:28px;border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:13px;font-weight:700;
  }
  .wb-list-row__info{flex:1;min-width:0;}
  .wb-list-row__name{font-size:13px;font-weight:600;color:var(--text-primary);}
  .wb-list-row__meta{font-size:11px;color:var(--text-muted);}
  .wb-list-row__radio{
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--color-gray-200);display:flex;align-items:center;justify-content:center;
    transition:all var(--transition);
  }
  .wb-list-row--selected .wb-list-row__radio{
    border-color:var(--accent);background:var(--accent);
  }
  .wb-list-row--selected .wb-list-row__radio::after{
    content:'';width:3px;height:6px;border-right:2px solid var(--color-base-02);
    border-bottom:2px solid var(--color-base-02);transform:rotate(45deg) translate(-1px,-1px);
  }

  /* Auto-selected workbook pill (compact) */
  .wb-auto-pill{
    display:flex;align-items:center;gap:8px;
    padding:8px 12px;background:var(--accent-light);
    border:1.5px solid var(--accent);border-radius:var(--radius-sm);
    font-size:13px;color:var(--color-primary-950);font-weight:600;
  }
  .wb-auto-pill__icon{
    width:26px;height:26px;border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-size:13px;font-weight:700;
  }

  /* Chapter search + scrollable list */
  .chapter-search{
    display:flex;align-items:center;gap:8px;
    padding:6px 12px;margin-bottom:8px;
    background:var(--color-gray-50);border:1px solid var(--border);
    border-radius:var(--radius-full);transition:border-color var(--transition);
  }
  .chapter-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
  .chapter-search svg{width:14px;height:14px;color:var(--text-muted);flex-shrink:0;}
  .chapter-search input{
    border:none;outline:none;background:transparent;font-size:12px;
    color:var(--text-primary);flex:1;font-family:var(--font-body);
  }
  .chapter-search input::placeholder{color:var(--text-muted);}
  .chapter-search__count{font-size:11px;color:var(--text-muted);white-space:nowrap;}

  .chapter-list{
    max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:0;
    border:1px solid var(--border);border-radius:var(--radius);
    background:var(--color-gray-50);
  }
  .chapter-list::-webkit-scrollbar{width:5px;}
  .chapter-list::-webkit-scrollbar-track{background:transparent;}
  .chapter-list::-webkit-scrollbar-thumb{background:var(--color-gray-200);border-radius:3px;}

  .ch-row{
    display:flex;align-items:center;gap:8px;
    padding:7px 12px;cursor:pointer;user-select:none;
    transition:all var(--transition);border-bottom:1px solid var(--color-gray-50);
    font-size:12px;color:var(--text-primary);
  }
  .ch-row:last-child{border-bottom:none;}
  .ch-row:hover{background:var(--color-primary-50);}
  .ch-row--selected{
    background:var(--accent-light);color:var(--color-primary-950);font-weight:600;
  }
  .ch-row--hidden{display:none;}
  .ch-row__num{
    width:22px;height:22px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--text-muted);
    background:var(--color-gray-50);
  }
  .ch-row--selected .ch-row__num{background:var(--accent);color:var(--color-base-02);}
  .ch-row__name{flex:1;}
  .ch-row__check{
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    border:2px solid var(--color-gray-200);transition:all var(--transition);
  }
  .ch-row--selected .ch-row__check{
    border-color:var(--accent);background:var(--accent);
  }
  .ch-row--selected .ch-row__check::after{
    content:'';display:block;width:3px;height:6px;
    border-right:2px solid var(--color-base-02);border-bottom:2px solid var(--color-base-02);
    transform:rotate(45deg) translate(3px,-1px);
  }
  .chapter-empty{text-align:center;padding:16px;font-size:12px;color:var(--text-muted);}

  /* Subject color mapping */
  .subject-math{background:var(--color-math-bg);color:var(--color-math);}
  .subject-english{background:var(--color-english-bg);color:var(--color-english);}
  .subject-chinese{background:var(--color-chinese-bg);color:var(--color-chinese);}
  .subject-physics{background:var(--color-physics-bg);color:var(--color-physics);}

  .reset-link{
    font-size:12px;color:var(--text-muted);text-decoration:none;
    display:inline-flex;align-items:center;gap:4px;transition:color var(--transition);
  }
  .reset-link:hover{color:var(--accent);}

  .multi-toggle{font-size:10px;font-weight:400;color:var(--color-gray-400);cursor:pointer;padding:2px 8px;border-radius:var(--radius-full);border:1px solid var(--color-gray-100);transition:all var(--transition);user-select:none;white-space:nowrap;margin-left:4px;}
  .multi-toggle:hover{color:var(--accent);border-color:var(--accent);}
  .multi-toggle--active{color:var(--color-base-02);background:var(--accent);border-color:var(--accent);font-weight:600;}
  .multi-toggle--active:hover{color:var(--color-base-02);background:var(--color-primary-950);}

  /* === Right Panel === */
  .right-panel{
    width:400px;padding:24px 28px 16px 0;display:flex;
    flex-direction:column;gap:12px;flex-shrink:0;
  }
  .info-card{
    background:var(--bg-card);border-radius:var(--radius-lg);
    padding:16px;border:1px solid var(--border);box-shadow:var(--shadow-sm);
  }
  .info-card__title{
    font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:0.8px;color:var(--text-muted);margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .info-card__title svg{width:14px;height:14px;opacity:0.7;}

  .summary-list{display:flex;flex-direction:column;gap:5px;}
  .summary-row{
    display:flex;justify-content:space-between;font-size:12px;
    padding:4px 0;border-bottom:1px dashed var(--color-gray-50);
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-row__label{color:var(--text-secondary);}
  .summary-row__value{color:var(--text-primary);font-weight:600;}
  .summary-row__value--pending{color:var(--text-muted);font-weight:400;font-style:italic;}

  .device-status-row{
    display:flex;align-items:center;gap:8px;padding:8px 0;
  }
  .device-status-row__icon-wrap{
    width:36px;height:36px;border-radius:var(--radius);
    background:var(--accent-light);display:flex;align-items:center;
    justify-content:center;flex-shrink:0;
  }
  .device-status-row__info{flex:1;}
  .device-status-row__name{font-size:12px;font-weight:600;color:var(--text-primary);}
  .device-status-row__status{
    font-size:11px;color:var(--success);display:flex;align-items:center;gap:4px;
  }
  .pulse-dot{
    width:7px;height:7px;border-radius:50%;background:var(--success);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.5;transform:scale(1.2);}
  }

  .footer{
    background:var(--color-base-02);border-top:1px solid var(--border);
    padding:16px 24px;display:flex;align-items:center;
    justify-content:space-between;flex-shrink:0;
  }
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 24px;font-size:14px;font-weight:600;
    font-family:var(--font-body);border-radius:var(--radius-full);
    cursor:pointer;transition:all var(--transition);
    border:none;text-decoration:none;letter-spacing:0.3px;
  }
  .btn-secondary{
    background:var(--color-base-02);color:var(--text-secondary);border:1.5px solid var(--border);
  }
  .btn-secondary:hover{border-color:var(--color-gray-200);color:var(--text-primary);background:var(--color-gray-50);}
  .btn-primary{
    background:var(--accent);color:var(--color-base-02);
    box-shadow:0 2px 8px var(--color-overlay-alpha-2-30);
    position:relative;overflow:hidden;
  }
  .btn-primary::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,var(--color-overlay-alpha-1-15) 0%,transparent 60%);
    pointer-events:none;
  }
  .btn-primary:hover{
    background:var(--color-primary-950);box-shadow:0 4px 16px var(--color-overlay-alpha-2-40);transform:translateY(-1px);
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none;}
  .btn-start-scan{

  function findWorkbook() {
    if (!state.selectedGrade || !state.selectedSubject || !state.selectedWorkbook) return null;
    const key = state.selectedGrade + '-' + state.selectedSubject;
    return (schoolWorkbooks[key] || []).find(w => w.id === state.selectedWorkbook) || null;
  }

  function updateSummary() {
    const list = document.getElementById('summaryList');
    const items = [];
    if (state.selectedGrade) items.push({ label:'年级', value:teacherPermissions.grades[state.selectedGrade].label });
    if (state.selectedSubject) items.push({ label:'科目', value:subjectConfig[state.selectedSubject].label });
    if (state.selectedClasses.length > 0) {
      items.push({ label:'班级', value:state.selectedClasses.map(id => teacherPermissions.classes[id].label).join('、') });
    }
    if (state.selectedWorkbook) {
      const wb = findWorkbook();
      if (wb) items.push({ label:'作业本', value:wb.name });
    }
    if (state.selectedChapter) items.push({ label:'章节', value:state.selectedChapter });

    if (items.length === 0) {
      list.innerHTML = '<div class="summary-row"><span class="summary-row__value summary-row__value--pending">请依次选择年级、科目、班级、作业本和章节</span></div>';
    } else {
      list.innerHTML = items.map(i =>
        '<div class="summary-row"><span class="summary-row__label">'+i.label+'</span><span class="summary-row__value">'+i.value+'</span></div>'
      ).join('');
    }
  }

  function updateFooter() {
    const allDone = state.selectedGrade && state.selectedSubject &&
                    state.selectedClasses.length > 0 &&
                    state.selectedWorkbook && state.selectedChapter;
    document.getElementById('startScanBtn').disabled = !allDone;

    const parts = [];
    if (state.selectedGrade) parts.push(teacherPermissions.grades[state.selectedGrade].label);
    if (state.selectedClasses.length > 0) {
      parts.push(state.selectedClasses.map(id => teacherPermissions.classes[id].label).join('、'));
    }
    if (state.selectedSubject) parts.push(subjectConfig[state.selectedSubject].label);
    if (state.selectedWorkbook) {
      const wb = findWorkbook();
      if (wb) parts.push('《'+wb.name+'》');
    }
    if (state.selectedChapter) parts.push(state.selectedChapter);

    if (!state.selectedGrade)       document.getElementById('footerHint').textContent = '请先选择年级';
    else if (state.selectedClasses.length === 0) document.getElementById('footerHint').textContent = '请选择班级';
    else if (!state.selectedSubject) document.getElementById('footerHint').textContent = '请选择科目';
    else if (!state.selectedWorkbook) document.getElementById('footerHint').textContent = '请选择校本作业本';
    else if (!state.selectedChapter)  document.getElementById('footerHint').textContent = '请选择作业章节';
    else document.getElementById('footerHint').textContent = '已选：'+parts.join(' ｜ ')+'  — 准备就绪';
  }

  // ===== Step 1: 年级 → 展开班级 =====
  function selectGrade(el) {
    document.querySelectorAll('#gradeCards .selection-card').forEach(c => c.classList.remove('selection-card--selected'));
    el.classList.add('selection-card--selected');
    const val = el.dataset.value;
    state = { ...state, selectedGrade:val, selectedSubject:null, selectedClasses:[], selectedWorkbook:null, selectedChapter:null };
    resetStepDots(); markStepDone(1);

    const gradeData = teacherPermissions.grades[val];
    const clsCards = document.getElementById('classCards');
    clsCards.innerHTML = '';
    gradeData.classes.forEach(clsId => {
      const cls = teacherPermissions.classes[clsId];
      const card = document.createElement('div');
      card.className = 'selection-card'; card.dataset.value = clsId; card.dataset.label = cls.label;
      card.textContent = cls.label;
      card.onclick = function() { toggleClass(this); };
      clsCards.appendChild(card);
    });

    document.getElementById('classGroup').style.display = 'block';
    hideAfter(2);
    document.getElementById('resetArea').hidden = false;
    updateSummary(); updateFooter();
    document.getElementById('classGroup').scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  // ===== Step 2: 班级（多选）→ 展开科目 =====
  function toggleClass(el) {
    const val = el.dataset.value;

    if (!multiMode) {
      // Single-select
      state.selectedClasses = [val];
      document.querySelectorAll('#classCards .selection-card').forEach(c => {
        c.classList.toggle('selection-card--selected', c.dataset.value === val);
      });
    } else {
      // Multi-select
      const idx = state.selectedClasses.indexOf(val);
      if (idx >= 0) { state.selectedClasses.splice(idx,1); el.classList.remove('selection-card--selected'); }
      else { state.selectedClasses.push(val); el.classList.add('selection-card--selected'); }
    }

    state.selectedSubject = null; state.selectedWorkbook = null; state.selectedChapter = null;
    resetStepDots(); markStepDone(2);

    if (state.selectedClasses.length > 0) {
      // Populate subjects based on grade
      const gradeData = teacherPermissions.grades[state.selectedGrade];
      const subjCards = document.getElementById('subjectCards');
      subjCards.innerHTML = '';
      gradeData.subjects.forEach(sid => {
        const cfg = subjectConfig[sid];
        const card = document.createElement('div');
        card.className = 'selection-card'; card.dataset.value = sid; card.dataset.label = cfg.label;
        card.textContent = cfg.label;
        card.onclick = function() { selectSubject(this); };
        subjCards.appendChild(card);
      });

      document.getElementById('subjectGroup').style.display = 'block';
      document.getElementById('workbookGroup').style.display = 'none';
      document.getElementById('chapterGroup').style.display = 'none';
      document.getElementById('subjectGroup').scrollIntoView({ behavior:'smooth', block:'nearest' });
    } else {
      document.getElementById('subjectGroup').style.display = 'none';
      document.getElementById('workbookGroup').style.display = 'none';
      document.getElementById('chapterGroup').style.display = 'none';
    }
    updateSummary(); updateFooter();
  }

  // ===== Step 3: 科目 → 展开作业本（基于 年级+科目，与班级无关）=====
  function selectSubject(el) {
    document.querySelectorAll('#subjectCards .selection-card').forEach(c => c.classList.remove('selection-card--selected'));
    el.classList.add('selection-card--selected');
    state.selectedSubject = el.dataset.value;
    state.selectedWorkbook = null; state.selectedChapter = null;
    resetStepDots(); markStepDone(3);

    renderWorkbooks();
    document.getElementById('workbookGroup').style.display = 'block';
    document.getElementById('chapterGroup').style.display = 'none';
    updateSummary(); updateFooter();
    document.getElementById('workbookGroup').scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  // ===== Step 4: 校本作业本（紧凑列表）=====
  function renderWorkbooks() {
    const key = state.selectedGrade + '-' + state.selectedSubject;
    const wbs = schoolWorkbooks[key] || [];
    const area = document.getElementById('workbookArea');

    if (wbs.length === 0) {
      area.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:8px 0;">该年级科目暂无配置校本作业本</div>';
      return;
    }

    if (wbs.length === 1) {
      // 仅一本 → 自动选中
      state.selectedWorkbook = wbs[0].id;
      const cfg = subjectConfig[state.selectedSubject];
      area.innerHTML = '<div class="wb-auto-pill">'
        + '<span class="wb-auto-pill__icon '+cfg.css+'">'+cfg.icon+'</span>'
        + '<span>'+wbs[0].name+'</span>'
        + '<span style="font-size:10px;color:var(--text-muted);margin-left:auto;">默认作业本 · '+wbs[0].chapters.length+' 个章节</span>'
        + '</div>';
      renderChapters();
      document.getElementById('chapterGroup').style.display = 'block';
      markStepDone(4);
    } else {
      // 多本 → 紧凑单选行
      state.selectedWorkbook = null;
      const cfg = subjectConfig[state.selectedSubject];
      area.innerHTML = '<div class="wb-list">' + wbs.map((wb, i) =>
        '<div class="wb-list-row" onclick="selectWorkbook(this,\''+wb.id+'\')" data-wbid="'+wb.id+'">'
        + '<span class="wb-list-row__icon '+cfg.css+'">'+cfg.icon+'</span>'
        + '<div class="wb-list-row__info">'
        + '<div class="wb-list-row__name">'+wb.name+'</div>'
        + '<div class="wb-list-row__meta">'+wb.chapters.length+' 个章节</div>'
        + '</div>'
        + '<span class="wb-list-row__radio"></span>'
        + '</div>'
      ).join('') + '</div>';
    }

    resetStepDots();
    markStepDone(3);
    if (state.selectedWorkbook) markStepDone(4);
    updateSummary(); updateFooter();
  }

  function selectWorkbook(el, wbId) {
    document.querySelectorAll('#workbookArea .wb-list-row').forEach(r => r.classList.remove('wb-list-row--selected'));
    el.classList.add('wb-list-row--selected');
    state.selectedWorkbook = wbId;
    state.selectedChapter = null;
    resetStepDots(); markStepDone(4);

    renderChapters();
    document.getElementById('chapterGroup').style.display = 'block';
    document.getElementById('chapterGroup').scrollIntoView({ behavior:'smooth', block:'nearest' });
    updateSummary(); updateFooter();
  }

  // ===== Step 5: 章节（可搜索滚动列表）=====
  function renderChapters() {
    const wb = findWorkbook();
    const list = document.getElementById('chapterList');
    const label = document.getElementById('chapterCountLabel');
    const countEl = document.getElementById('chapterSearchCount');
    const input = document.getElementById('chapterSearchInput');

    if (!wb) { list.innerHTML = ''; label.textContent = ''; countEl.textContent = ''; return; }

    label.textContent = '（共 '+wb.chapters.length+' 节）';
    countEl.textContent = wb.chapters.length + ' 节';
    input.value = '';

    list.innerHTML = wb.chapters.map((ch, i) =>
      '<div class="ch-row'+(state.selectedChapter===ch?' ch-row--selected':'')+'"'
      + ' onclick="selectChapter(this)" data-chapter="'+ch.replace(/"/g,'&quot;')+'" data-idx="'+i+'">'
      + '<span class="ch-row__num">'+(i+1)+'</span>'
      + '<span class="ch-row__name">'+ch+'</span>'
      + '<span class="ch-row__check"></span>'
      + '</div>'
    ).join('');

    if (state.selectedChapter) {
      // Scroll to selected
      setTimeout(() => {
        const sel = list.querySelector('.ch-row--selected');
        if (sel) sel.scrollIntoView({ block:'center' });
      }, 50);
    }
  }

  function selectChapter(el) {
    document.querySelectorAll('#chapterList .ch-row').forEach(r => r.classList.remove('ch-row--selected'));
    el.classList.add('ch-row--selected');
    state.selectedChapter = el.dataset.chapter;
    markStepDone(5);
    updateSummary(); updateFooter();
  }

  function filterChapters() {
    const q = document.getElementById('chapterSearchInput').value.trim().toLowerCase();
    const rows = document.querySelectorAll('#chapterList .ch-row');
    let visible = 0;
    rows.forEach(r => {
      const match = !q || r.querySelector('.ch-row__name').textContent.toLowerCase().includes(q);
      r.classList.toggle('ch-row--hidden', !match);
      if (match) visible++;
    });
    document.getElementById('chapterSearchCount').textContent = q ? visible+' / '+rows.length+' 节' : rows.length+' 节';
  }

  // ===== Reset =====
  function resetAll(e) {
    if (e) e.preventDefault();
    state = { selectedGrade:null, selectedSubject:null, selectedClasses:[], selectedWorkbook:null, selectedChapter:null };
    document.querySelectorAll('.selection-card--selected,.wb-list-row--selected').forEach(c => c.classList.remove('selection-card--selected','wb-list-row--selected'));
    ['subjectGroup','classGroup','workbookGroup','chapterGroup'].forEach(id => document.getElementById(id).style.display = 'none');
    document.getElementById('startScanBtn').disabled = true;
    document.getElementById('footerHint').textContent = '请先选择年级、科目和班级';
    document.getElementById('resetArea').hidden = true;
    resetStepDots(); updateSummary();
  }

  function startScan() {
    if (!state.selectedGrade || !state.selectedSubject || state.selectedClasses.length===0 || !state.selectedWorkbook || !state.selectedChapter) return;
    window.location.href = 'scan-progress.html?mode=designated&first=1';
  }

  function showToast(msg) {
    const e = document.querySelector('.toast'); if(e) e.remove();
    const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{t.classList.add('toast--out');setTimeout(()=>t.remove(),200);},2200);
  }

  updateSummary();
</script>
</body>
</html>
