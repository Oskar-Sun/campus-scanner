<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫描打印系统 — 扫描进行中</title>
<style>
  :root {
    /* ===== Primary (品牌/交互) ===== */
    --color-primary-50: #effafa;
    --color-primary-100: #def8f9;
    --color-primary-200: #b2f1f2;
    --color-primary-300: #7de3e6;
    --color-primary-500: #50d8dc;
    --color-primary-700: #00a6ab;
    --color-primary-950: #007a7e;

    /* ===== Gray ===== */
    --color-gray-50: #f8f8fc;
    --color-gray-100: #d2d3de;
    --color-gray-200: #bcbdc0;
    --color-gray-300: #a2a3a6;
    --color-gray-400: #88898c;
    --color-gray-500: #6e6f71;
    --color-gray-600: #545557;
    --color-gray-700: #3a3b3d;
    --color-gray-900: #212123;

    /* ===== Base ===== */
    --color-base-01: #000000;
    --color-base-02: #ffffff;

    /* ===== Semantic - Success (结果反馈，非交互) ===== */
    --color-success-100: #bef8fa;
    --color-success-300: #66dade;
    --color-success-500: #11c5ca;
    --color-success-700: #00a6ab;
    --color-success-900: #008a8f;

    /* ===== Semantic - Error ===== */
    --color-error-100: #ffece8;
    --color-error-300: #fdcdc5;
    --color-error-500: #fbaca3;
    --color-error-700: #f53f3f;
    --color-error-900: #cb2634;

    /* ===== Semantic - Warning ===== */
    --color-warning-100: #fff7e8;
    --color-warning-300: #ffe4ba;
    --color-warning-500: #ffcf8b;
    --color-warning-700: #ff7d00;
    --color-warning-900: #d25f00;

    /* ===== Semantic - Info ===== */
    --color-info-100: #e4f0fb;
    --color-info-300: #97c4f1;
    --color-info-500: #3089e3;
    --color-info-700: #2675c4;
    --color-info-900: #185695;

    /* ===== Accent (分类/图表专用，非交互) ===== */
    --color-accent-1-50: #d2f0e1;
    --color-accent-1-400: #a7eaca;
    --color-accent-1-600: #5ad0a3;
    --color-accent-1-800: #049d75;

    --color-accent-2-50: #fff1f7;
    --color-accent-2-400: #fbcde4;
    --color-accent-2-600: #ff86c8;
    --color-accent-2-800: #d14692;

    --color-accent-3-50: #f3f1ff;
    --color-accent-3-400: #cfc6ff;
    --color-accent-3-600: #8b6ff2;
    --color-accent-3-800: #5936b1;

    --color-accent-4-50: #fff9e7;
    --color-accent-4-400: #ffeeb6;
    --color-accent-4-600: #f9b932;
    --color-accent-4-800: #c27b00;

    /* ===== Overlay (半透明唯一来源) ===== */
    --color-overlay-alpha-2-5: rgba(19,19,21,0.05);
    --color-overlay-alpha-2-10: rgba(19,19,21,0.10);
    --color-overlay-alpha-2-20: rgba(19,19,21,0.20);
    --color-overlay-alpha-2-30: rgba(19,19,21,0.30);
    --color-overlay-alpha-2-40: rgba(19,19,21,0.40);
    --color-overlay-alpha-2-80: rgba(19,19,21,0.80);
    --color-overlay-alpha-2-90: rgba(19,19,21,0.90);

    --color-overlay-alpha-1-10: rgba(255,255,255,0.10);
    --color-overlay-alpha-1-18: rgba(255,255,255,0.18);
    --color-overlay-alpha-1-20: rgba(255,255,255,0.20);
    --color-overlay-alpha-1-35: rgba(255,255,255,0.35);
    --color-overlay-alpha-1-60: rgba(255,255,255,0.60);
    --color-overlay-alpha-1-78: rgba(255,255,255,0.78);
    --color-overlay-alpha-1-92: rgba(255,255,255,0.92);

    /* ===== Legacy aliases (向后兼容) ===== */
    --bg-primary: var(--color-gray-50);
    --bg-header: var(--color-primary-950);
    --text-primary: var(--color-gray-900);
    --text-secondary: var(--color-gray-500);
    --text-muted: var(--color-gray-400);
    --border: var(--color-gray-100);
    --accent: var(--color-primary-700);
    --accent-dark: var(--color-primary-950);
    --accent-light: var(--color-primary-50);
    --success: var(--color-success-700);
    --danger: var(--color-error-700);
    --danger-bg: var(--color-error-100);

    /* Legacy assignment color aliases (mapped to accent tokens for classification/data-viz) */
    --color-math: var(--color-accent-1-600);
    --color-math-bg: var(--color-accent-1-50);
    --color-math-light: var(--color-accent-1-50);
    --color-english: var(--color-accent-3-600);
    --color-english-bg: var(--color-accent-3-50);
    --color-english-light: var(--color-accent-3-50);
    --color-chinese: var(--color-accent-4-600);
    --color-chinese-bg: var(--color-accent-4-50);
    --color-chinese-light: var(--color-accent-4-50);
    --color-physics: var(--color-accent-2-600);
    --color-physics-bg: var(--color-accent-2-50);
    --color-physics-light: var(--color-accent-2-50);

    /* ===== Shadows (using overlay-alpha tokens) ===== */
    --shadow-sm: 0 1px 2px var(--color-overlay-alpha-2-5);
    --shadow-md: 0 4px 12px var(--color-overlay-alpha-2-10);
    --shadow-lg: 0 12px 32px var(--color-overlay-alpha-2-10);

    /* ===== Border Radius ===== */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --radius-xl: 28px;
    --radius-full: 9999px;

    /* ===== Typography & Motion ===== */
    --font-display: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    --font-body: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    --transition: 160ms cubic-bezier(0.4,0,0.2,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:var(--font-body);
    background:var(--color-gray-50);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;-webkit-font-smoothing:antialiased;
  }

  .app-window{
    width:1560px;max-width:100%;
    background:var(--color-base-02);
    border-radius:var(--radius-xl);
    box-shadow:0 0 0 1px var(--color-overlay-alpha-2-10),0 24px 64px var(--color-overlay-alpha-2-20);
    overflow:hidden;display:flex;flex-direction:column;max-height:95vh;position:relative;
  }

  .title-bar{
    height:32px;background:var(--color-primary-950);
    display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;
  }
  .title-bar__dots{display:flex;gap:7px;}
  .title-bar__dot{width:11px;height:11px;border-radius:50%;}
  .title-bar__dot--close{background:var(--color-error-700);}
  .title-bar__dot--min{background:var(--color-warning-700);}
  .title-bar__dot--max{background:var(--color-success-700);}
  .title-bar__title{flex:1;text-align:center;color:var(--color-overlay-alpha-1-60);font-size:11px;}

  .header{
    background:linear-gradient(135deg,var(--color-primary-950) 0%,var(--color-primary-700) 60%,var(--color-primary-500) 100%);
    padding:0 24px;height:52px;display:flex;align-items:center;gap:14px;flex-shrink:0;
  }
  .header__back{
    display:flex;align-items:center;gap:5px;color:var(--color-overlay-alpha-1-78);
    font-size:13px;cursor:pointer;text-decoration:none;padding:4px 8px;border-radius:var(--radius-sm);
  }
  .header__back:hover{color:var(--color-base-02);background:var(--color-overlay-alpha-1-10);}
  .header__back svg{width:15px;height:15px;opacity:0.8;}
  .header__breadcrumb{color:var(--color-overlay-alpha-1-35);font-size:13px;}
  .header__page-title{color:var(--color-base-02);font-size:15px;font-weight:600;flex:1;}

  /* Scan Info Bar */
  .scan-info-bar{
    background:var(--color-base-02);
    border-bottom:1px solid var(--color-gray-100);padding:12px 28px;
    display:flex;align-items:center;gap:18px;flex-shrink:0;
  }
  .scan-info-bar__item{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .scan-info-bar__icon{
    width:32px;height:32px;border-radius:var(--radius-md);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--color-primary-50);color:var(--color-primary-700);
  }
  .scan-info-bar__label{font-size:10px;color:var(--color-gray-400);}
  .scan-info-bar__value{font-size:13px;font-weight:600;color:var(--color-gray-900);}

  /* Class badges in scan-info-bar */
  .scan-info-bar__classes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .class-badge{
    display:flex;align-items:center;gap:5px;
    padding:5px 12px;border-radius:var(--radius-full);
    font-size:12px;font-weight:600;white-space:nowrap;
    background:var(--color-primary-50);
    border:1.5px solid var(--color-primary-200);color:var(--color-primary-950);
    transition:all var(--transition);cursor:pointer;user-select:none;
  }
  .class-badge:hover{background:var(--color-primary-100);border-color:var(--color-primary-500);}
  .class-badge--inactive{
    background:var(--color-gray-50);border-color:var(--color-gray-100);color:var(--color-gray-400);
  }
  .class-badge--inactive:hover{background:var(--color-gray-100);border-color:var(--color-gray-200);}
  .class-badge--inactive .class-badge__dot{background:var(--color-gray-200);}
  .class-badge--inactive .class-badge__count{color:var(--color-gray-300);}
  .class-badge__dot{width:7px;height:7px;border-radius:50%;background:var(--color-primary-700);flex-shrink:0;transition:background var(--transition);}
  .class-badge__count{font-size:11px;font-weight:400;color:var(--color-gray-400);transition:color var(--transition);}

  .scan-info-bar__assignments{display:flex;gap:8px;flex:1;overflow-x:auto;align-items:center;}
  .scan-info-bar__assignments::-webkit-scrollbar{height:3px;}
  .scan-info-bar__assignments::-webkit-scrollbar-thumb{background:var(--color-gray-100);border-radius:2px;}
  .assignment-badge{
    display:flex;align-items:center;gap:6px;padding:6px 14px 6px 10px;
    border-radius:var(--radius-full);white-space:nowrap;flex-shrink:0;font-size:12px;font-weight:600;
    cursor:pointer;user-select:none;transition:all var(--transition);
    border:1.5px solid transparent;
  }
  .assignment-badge:hover{filter:brightness(0.92);}
  .assignment-badge--inactive{
    background:var(--color-gray-50) !important;
    border-color:var(--color-gray-100) !important;
    opacity:0.55;
  }
  .assignment-badge--inactive .assignment-badge__dot{background:var(--color-gray-200) !important;}
  .assignment-badge--inactive .assignment-badge__name{color:var(--color-gray-400) !important;}
  .assignment-badge--inactive:hover{opacity:0.75;}
  .assignment-badge__dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background var(--transition);}
  .assignment-badge__name{font-size:12px;transition:color var(--transition);}
  .assignment-badge__count{font-size:11px;opacity:0.75;padding:1px 7px;border-radius:10px;background:var(--color-overlay-alpha-2-10);}

  .scan-info-bar__divider{
    width:1px;height:26px;flex-shrink:0;
    background:linear-gradient(180deg,var(--color-overlay-alpha-2-5) 0%,var(--color-gray-100) 50%,var(--color-overlay-alpha-2-5) 100%);
  }
  .scan-info-bar__progress-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;}
  #filterResetLink:hover{background:var(--color-primary-50);color:var(--color-primary-700);}
  .scan-info-bar__progress-text{font-size:12px;color:var(--color-gray-500);white-space:nowrap;}

  /* Estimated grading completion time — 智能批改后台排队提示 */
  .scan-info-bar__eta{
    display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
    padding:6px 12px;border-radius:var(--radius-full);
    background:var(--color-info-100);border:1.5px solid var(--color-info-300);
    color:var(--color-info-900);font-size:12px;font-weight:600;white-space:nowrap;
  }
  .scan-info-bar__eta svg{width:14px;height:14px;flex-shrink:0;color:var(--color-info-700);}
  .scan-info-bar__eta strong{color:var(--color-info-700);font-weight:700;}

  /* === Main Content === */
  .main-content{display:flex;flex:1;overflow:hidden;}

  /* === Card Grid Wrapper === */
  .card-grid-wrapper{flex:1;overflow-y:auto;}
  .card-grid-wrapper::-webkit-scrollbar{width:5px;}
  .card-grid-wrapper::-webkit-scrollbar-track{background:transparent;}
  .card-grid-wrapper::-webkit-scrollbar-thumb{background:var(--color-gray-100);border-radius:3px;}

  .card-section{padding:12px 14px 6px 18px;}
  .card-section+.card-section{border-top:1px solid var(--color-gray-100);}
  .card-section__header{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
    font-size:13px;font-weight:600;color:var(--color-gray-900);
  }
  .card-section__header .count{font-size:11px;color:var(--color-gray-400);font-weight:400;}
  .section-dot{width:8px;height:8px;border-radius:50%;}
  .section-dot--scanned{background:var(--color-primary-700);}
  .section-dot--unscanned{background:var(--color-gray-100);}
  .section-select-all{
    margin-left:auto;font-size:11px;color:var(--color-primary-700);cursor:pointer;user-select:none;
    padding:3px 10px;border-radius:var(--radius-sm);transition:all var(--transition);
    border:1px solid transparent;
  }
  .section-select-all:hover{background:var(--color-primary-50);border-color:var(--color-primary-200);}

  /* Flip order button — now in section header */
  .section-flip-btn{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11px;font-weight:500;color:var(--color-primary-700);cursor:pointer;
    padding:3px 10px;border-radius:var(--radius-full);border:1.5px solid var(--color-primary-200);
    background:var(--color-primary-50);transition:all var(--transition);
    white-space:nowrap;user-select:none;
  }
  .section-flip-btn:hover:not(:disabled){background:var(--color-primary-200);border-color:var(--color-primary-700);}
  .section-flip-btn:disabled{opacity:0.35;cursor:not-allowed;color:var(--color-gray-400);background:var(--color-gray-50);border-color:var(--color-gray-100);}
  .section-flip-btn svg{width:13px;height:13px;}

  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(148px, 1fr));
    gap:4px;
  }
  @media (min-width:1400px){.card-grid{grid-template-columns:repeat(8, 1fr);}}

  /* === Student Card === */
  .student-card{
    display:flex;align-items:center;gap:4px;
    padding:4px 7px;border-radius:var(--radius-sm);cursor:pointer;
    transition:all var(--transition);user-select:none;
    border:1.5px solid var(--color-gray-100);background:var(--color-base-02);
    font-size:12px;color:var(--color-gray-900);font-weight:500;
    position:relative;overflow:hidden;min-width:0;
  }
  .student-card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  }
  .student-card:hover{border-color:var(--color-primary-300);box-shadow:var(--shadow-sm);}
  .student-card--selected{
    border-color:var(--color-primary-700);background:var(--color-primary-50);
  }
  .student-card--anomaly{
    border-color:var(--color-error-300);background:var(--color-error-100);
  }
  .student-card--anomaly:hover{border-color:var(--color-error-500);}
  .student-card--anomaly.student-card--selected{
    border-color:var(--color-error-700);background:var(--color-error-100);
  }
  .student-card--printed{
    /* Printed cards: gray when unselected, teal when selected (same as normal) */
  }
  .student-card--printed:not(.student-card--selected){
    background:var(--color-gray-50);
  }
  .student-card--printed::before{opacity:0.25;}
  .student-card--selected .student-card--printed::before,
  .student-card--printed.student-card--selected::before{opacity:1;}
  /* Printed indicator — vertical text, positioned left of detail button */
  .student-card--printed::after{
    content:'已\a打';
    white-space:pre;
    position:absolute;
    right:24px;top:50%;
    transform:translateY(-50%);
    font-size:7px;font-weight:500;
    color:var(--color-gray-200);
    pointer-events:none;
    z-index:1;
    line-height:1.3;
    text-align:center;
  }
  /* Printed anomaly cards: normalize to standard printed look (anomaly info shown via tag) */
  .student-card--anomaly.student-card--printed:not(.student-card--selected){
    background:var(--color-gray-50);
    border-color:var(--color-gray-100);
  }
  .student-card--anomaly.student-card--printed.student-card--selected{
    background:var(--color-primary-50);
    border-color:var(--color-primary-700);
  }

  /* Assignment color strip only */
  .student-card--math::before{background:var(--color-accent-1-600);}
  .student-card--english::before{background:var(--color-accent-3-600);}
  .student-card--chinese::before{background:var(--color-accent-4-600);}
  .student-card--physics::before{background:var(--color-accent-2-600);}

  /* Detail button — plain "›" on the right side of the card, no background */
  .student-card__detail{
    flex-shrink:0;border:none;background:none;
    color:var(--color-gray-300);font-size:15px;font-weight:700;
    cursor:pointer;transition:all var(--transition);
    line-height:1;font-family:var(--font-body);
    padding:0 2px;margin-left:auto;
  }
  .student-card__detail:hover{
    color:var(--color-primary-700);
  }
  .student-card--selected .student-card__detail{
    color:var(--color-primary-500);
  }
  .student-card--selected .student-card__detail:hover{
    color:var(--color-primary-950);
  }
  /* Selected state indicator — left accent strip becomes more prominent */
  .student-card--selected::before{width:4px !important;}
  /* Printed cards keep full interactivity — "已打印" is just a status tag */

  .student-card__spinner{
    width:12px;height:12px;border:2px solid var(--color-gray-100);border-top-color:var(--color-primary-700);
    border-radius:50%;animation:spin 800ms linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .student-card__name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .student-card__spacer{flex:1;min-width:0;}
  .student-card__tag{
    font-size:9px;font-weight:600;padding:1px 5px;border-radius:8px;
    white-space:nowrap;flex-shrink:0;
  }
  .student-card__tag--printed{background:var(--color-gray-100);color:var(--color-gray-500);}
  .student-card__tag--anomaly{background:var(--color-error-100);color:var(--color-error-700);}
  .student-card__tag--grading{background:var(--color-warning-100);color:var(--color-warning-700);}

  /* Unscanned card */
  .student-card--unscanned{
    cursor:default;border-style:dashed;background:var(--color-gray-50);
    color:var(--color-gray-400);border-color:var(--color-gray-100);
  }
  .student-card--unscanned::before{display:none;}
  .student-card--unscanned:hover{border-color:var(--color-gray-200);box-shadow:none;}

  /* Filtered out card */
  .student-card--filtered{
    opacity:0.32;pointer-events:none;
    background:var(--color-gray-50) !important;
    border-color:var(--color-gray-50) !important;
    color:var(--color-gray-300);
  }
  .student-card--filtered::before{opacity:0.12 !important;}
  .student-card--filtered .student-card__detail{
    color:var(--color-gray-200) !important;
    pointer-events:none;
  }

  /* === Right Operations Panel === */
  .ops-panel{
    width:260px;border-left:1px solid var(--color-gray-100);
    background:var(--color-base-02);
    padding:14px 12px;display:flex;flex-direction:column;gap:6px;flex-shrink:0;
  }
  .ops-panel__section-title{
    font-size:10px;font-weight:600;text-transform:uppercase;
    letter-spacing:1px;color:var(--color-gray-400);margin:6px 0 2px;padding-left:4px;
  }
  .ops-btn{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:9px 12px;border-radius:var(--radius-md);font-size:12px;font-weight:500;
    cursor:pointer;transition:all var(--transition);font-family:var(--font-body);
    text-align:left;color:var(--color-gray-900);
    background:var(--color-base-02);
    border:1px solid var(--color-gray-100);
  }
  .ops-btn:hover{background:var(--color-primary-50);border-color:var(--color-primary-200);}
  .ops-btn svg{width:16px;height:16px;flex-shrink:0;opacity:0.65;}
  .ops-btn--primary{
    background:linear-gradient(135deg,var(--color-primary-500) 0%,var(--color-primary-700) 100%);
    color:var(--color-base-02);font-weight:600;border:none;box-shadow:0 2px 8px var(--color-overlay-alpha-2-10);
  }
  .ops-btn--primary:hover{background:linear-gradient(135deg,var(--color-primary-700) 0%,var(--color-primary-950) 100%);}
  .ops-btn--primary svg{opacity:1;}
  .ops-btn--disabled{opacity:0.45;cursor:not-allowed;pointer-events:none;}

  /* Reorder button with inline help */
  .ops-btn--has-help{position:relative;}
  .ops-btn--has-help .help-tip-inline{
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    background:var(--color-overlay-alpha-2-10);color:var(--color-gray-400);font-size:10px;font-weight:700;
    cursor:help;transition:all var(--transition);margin-left:auto;position:relative;
  }
  .ops-btn--has-help .help-tip-inline:hover{background:var(--color-overlay-alpha-2-20);color:var(--color-gray-900);}
  .help-tip-inline__bubble{
    position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-80%);
    width:200px;padding:8px 12px;background:var(--color-gray-900);color:var(--color-base-02);
    font-size:11px;font-weight:400;line-height:1.5;border-radius:var(--radius-sm);
    pointer-events:none;opacity:0;transition:opacity 180ms;z-index:50;
    text-align:left;white-space:normal;
  }
  .help-tip-inline__bubble::after{
    content:'';position:absolute;top:100%;left:80%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--color-gray-900);
  }
  .help-tip-inline:hover .help-tip-inline__bubble{opacity:1;}

  /* Bubble tooltip pointing at a button */
  .ops-btn--with-bubble{position:relative;overflow:visible;}
  .btn-bubble{
    display:none;position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);
    width:170px;padding:8px 10px;background:var(--color-warning-100);border:1px solid var(--color-warning-300);
    border-radius:var(--radius-md);font-size:10px;font-weight:500;line-height:1.5;
    color:var(--color-warning-700);white-space:normal;text-align:left;
    box-shadow:var(--shadow-md);z-index:20;pointer-events:none;
  }
  .btn-bubble::after{
    content:'';position:absolute;left:100%;top:50%;transform:translateY(-50%);
    border:6px solid transparent;border-left-color:var(--color-warning-300);
  }
  .btn-bubble--visible{display:block;}

  /* === Footer === */
  .footer{
    background:var(--color-base-02);
    border-top:1px solid var(--color-gray-100);padding:9px 20px;
    display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
  }
  .footer__left{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--color-gray-500);}
  .footer__left strong{color:var(--color-primary-700);font-size:13px;}
  .footer__select-all{
    font-size:11px;color:var(--color-primary-700);cursor:pointer;user-select:none;
    padding:3px 8px;border-radius:var(--radius-sm);transition:all var(--transition);
  }
  .footer__select-all:hover{background:var(--color-primary-50);}
  .footer__actions{display:flex;gap:8px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 18px;font-size:12px;font-weight:600;
    font-family:var(--font-body);border-radius:var(--radius-md);
    cursor:pointer;transition:all var(--transition);border:none;text-decoration:none;
  }
  .btn-primary{
    background:linear-gradient(135deg,var(--color-primary-500) 0%,var(--color-primary-700) 100%);
    color:var(--color-base-02);box-shadow:0 2px 8px var(--color-overlay-alpha-2-10);
    position:relative;overflow:hidden;
  }
  .btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--color-overlay-alpha-1-18) 0%,transparent 55%);pointer-events:none;}
  .btn-primary:hover{background:linear-gradient(135deg,var(--color-primary-700) 0%,var(--color-primary-950) 100%);box-shadow:0 4px 16px var(--color-overlay-alpha-2-20);transform:translateY(-1px);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;pointer-events:none;}
  .btn-outline-danger{background:var(--color-base-02);color:var(--color-error-700);border:1.5px solid var(--color-error-300);}
  .btn-outline-danger:hover{background:var(--color-error-100);border-color:var(--color-error-500);}

  /* Batch anomaly button — shows anomaly count inline */
  .btn-outline-danger .btn-anomaly-count{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:20px;height:20px;padding:0 5px;border-radius:var(--radius-lg);
    background:var(--color-error-700);color:var(--color-base-02);font-size:11px;font-weight:700;
    margin-left:2px;
  }
  .btn-outline-danger:disabled .btn-anomaly-count{background:var(--color-gray-200);}

  /* === Anomaly Modal === */
  .modal-overlay{
    position:fixed;inset:0;z-index:200;background:var(--color-overlay-alpha-2-40);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;
  }
  .modal-overlay--visible{display:flex;}
  .modal{
    background:var(--color-base-02);border-radius:var(--radius-xl);width:600px;max-width:95vw;
    box-shadow:var(--shadow-lg);animation:modalIn 200ms ease-out;overflow:hidden;
  }
  @keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal__header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:var(--color-error-100);
    border-bottom:1px solid var(--color-error-300);
  }
  .modal__title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .modal__title .anomaly-icon{
    width:26px;height:26px;border-radius:50%;
    background:var(--color-error-100);
    color:var(--color-error-700);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  }
  .modal__close{width:28px;height:28px;border-radius:50%;border:none;background:var(--color-gray-50);cursor:pointer;font-size:14px;color:var(--color-gray-500);}
  .modal__close:hover{background:var(--color-gray-100);}
  .modal__body{padding:18px 20px;display:flex;gap:18px;}
  .modal__image-area{
    width:200px;height:260px;flex-shrink:0;
    background:var(--color-gray-50);
    border:1px solid var(--color-gray-100);border-radius:var(--radius-md);
    display:flex;align-items:center;justify-content:center;
    color:var(--color-gray-400);font-size:11px;flex-direction:column;gap:6px;
  }
  .modal__image-area svg{width:44px;height:44px;opacity:0.25;}
  .modal__info{flex:1;}
  .modal__info-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--color-gray-50);font-size:12px;}
  .modal__info-label{color:var(--color-gray-500);}
  .modal__info-value{color:var(--color-gray-900);font-weight:600;}
  .modal__info-value--anomaly{color:var(--color-error-700);}
  .modal__anomaly-desc{
    margin-top:10px;padding:10px 14px;
    background:var(--color-error-100);
    border-radius:var(--radius-sm);border:1px solid var(--color-error-300);
    font-size:11px;color:var(--color-error-900);line-height:1.6;
  }
  .modal__actions-row{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .modal__action-chip{
    padding:5px 12px;border-radius:var(--radius-full);font-size:11px;font-weight:500;
    border:1.5px solid var(--color-gray-100);background:var(--color-base-02);cursor:pointer;
    transition:all var(--transition);font-family:var(--font-body);
  }
  .modal__action-chip:hover{border-color:var(--color-primary-700);background:var(--color-primary-50);}
  .modal__action-chip--selected{
    border-color:var(--color-primary-700);background:var(--color-primary-100);
    color:var(--color-primary-950);font-weight:600;
  }
  .modal__footer{
    padding:10px 20px;background:var(--color-gray-50);
    border-top:1px solid var(--color-gray-100);display:flex;justify-content:flex-end;gap:8px;
  }
  .btn-sm{padding:6px 14px;font-size:12px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;border:none;font-family:var(--font-body);}
  .btn-sm--primary{background:linear-gradient(135deg,var(--color-primary-500) 0%,var(--color-primary-700) 100%);color:var(--color-base-02);}
  .btn-sm--primary:hover{background:linear-gradient(135deg,var(--color-primary-700) 0%,var(--color-primary-950) 100%);}
  .btn-sm--ghost{background:transparent;color:var(--color-gray-500);}
  .btn-sm--ghost:hover{background:var(--color-gray-50);}

  /* Toast */
  .toast{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);
    background:var(--color-gray-900);
    color:var(--color-base-02);padding:9px 18px;border-radius:var(--radius-full);font-size:12px;
    z-index:999;animation:toastIn 300ms ease-out;pointer-events:none;box-shadow:var(--shadow-lg);
  }
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-6px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
  .toast--out{animation:toastOut 200ms ease-in forwards;}
  @keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-6px);}}

  /* Loading overlay */
  .loading-overlay{
    position:absolute;inset:0;z-index:50;background:var(--color-overlay-alpha-1-92);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:opacity 400ms ease-out;
  }
  .loading-overlay--hidden{opacity:0;pointer-events:none;}
  .loading-spinner{
    width:48px;height:48px;border:4px solid var(--color-gray-100);border-top-color:var(--color-primary-700);
    border-radius:50%;animation:spin 800ms linear infinite;
  }
  .loading-text{font-size:14px;font-weight:600;color:var(--color-gray-900);}
  .loading-sub{font-size:11px;color:var(--color-gray-400);}
  .batch-tag{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 8px;border-radius:var(--radius-lg);font-size:10px;font-weight:600;
    background:var(--color-warning-100);color:var(--color-warning-700);margin-left:4px;
  }
</style>
</head>
<body>

<div class="app-window">
  <div class="title-bar">
    <div class="title-bar__dots">
      <div class="title-bar__dot title-bar__dot--close"></div>
      <div class="title-bar__dot title-bar__dot--min"></div>
      <div class="title-bar__dot title-bar__dot--max"></div>
    </div>
    <span class="title-bar__title">校园智能扫描打印系统</span>
  </div>

  <header class="header">
    <a href="index.html" class="header__back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      返回
    </a>
    <span class="header__breadcrumb">&gt;</span>
    <span class="header__page-title">扫描进行中</span>
    <a href="help-guide.html" class="header__back" style="margin-left:auto;" title="查看操作指南">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      帮助
    </a>
  </header>

  <!-- Scan Info Bar — 班级标签 + 作业颜色标识 -->
  <div class="scan-info-bar">
    <div class="scan-info-bar__item">
      <div class="scan-info-bar__icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      </div>
      <div>
        <div class="scan-info-bar__label">班级</div>
        <div class="scan-info-bar__classes" id="classBadges">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
    <div class="scan-info-bar__divider" id="assignmentDivider"></div>
    <span style="font-size:10px;color:var(--text-muted);font-weight:600;white-space:nowrap;flex-shrink:0;" id="assignmentLegend">作业颜色标识：</span>
    <span style="font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap;flex-shrink:0;display:none;" id="freeTaskLabel"></span>
    <div class="scan-info-bar__assignments" id="assignmentList">
      <!-- Dynamically populated -->
    </div>
    <span id="filterResetLink" style="font-size:10px;color:var(--color-gray-400);cursor:pointer;display:none;white-space:nowrap;flex-shrink:0;padding:3px 8px;border-radius:var(--radius-sm);transition:all var(--transition);" onclick="resetFilters()" title="恢复显示全部班级和作业">↺ 重置筛选</span>
    <div class="scan-info-bar__progress-wrap">
      <span class="scan-info-bar__progress-text">已扫描 <strong id="scannedNum" style="color:var(--accent);font-size:15px;">0</strong> 张</span>
      <span class="scan-info-bar__divider" style="height:20px;margin:0 6px;"></span>
      <span class="scan-info-bar__progress-text">已上传 <strong id="uploadedNum" style="color:var(--color-success-700);font-size:15px;">0</strong> 张</span>
    <!-- Upload mismatch handled by coloring the uploadedNum red -->
    </div>
    <span class="scan-info-bar__divider" style="margin:0 4px;"></span>
    <span class="scan-info-bar__eta" id="gradingEta" title="智能批改在后台排队处理中，批改完成后结果将自动更新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="gradingEtaText">预计 <strong id="gradingEtaMin">5</strong> 分钟批改完成</span>
    </span>
  </div>

  <!-- Upload mismatch warning banner -->
  <div id="uploadMismatchBanner" style="display:none;background:var(--color-warning-100);border-bottom:1px solid var(--color-warning-300);padding:8px 24px;font-size:11px;color:var(--color-warning-900);display:none;align-items:center;gap:8px;flex-shrink:0;">
    <span style="font-size:15px;">⚠️</span>
    <span id="uploadMismatchMsg"></span>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在启动扫描仪…</div>
    <div class="loading-sub">请稍候，扫描数据即将到达</div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="card-grid-wrapper" id="cardWrapper">
      <!-- Scanned section -->
      <div class="card-section" id="scannedSection">
        <div class="card-section__header">
          <span class="section-dot section-dot--scanned"></span>
          已扫描识别 <span class="count" id="scannedCountLabel">0 人</span>
          <span class="batch-tag" id="anomalyCountTag" style="display:none;"></span>
          <button class="section-flip-btn" id="flipOrderBtn" onclick="flipCardOrder()" disabled title="识别完成后可颠倒卡片顺序">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            颠倒顺序
          </button>
          <span class="section-select-all" id="sectionSelectAll" onclick="toggleSelectAll()">全选</span>
        </div>
        <div class="card-grid" id="scannedGrid"></div>
      </div>
      <!-- Unscanned section -->
      <div class="card-section" id="unscannedSection">
        <div class="card-section__header">
          <span class="section-dot section-dot--unscanned"></span>
          未扫描学生 <span class="count" id="unscannedCountLabel">0 人</span>
        </div>
        <div class="card-grid" id="unscannedGrid"></div>
      </div>
    </div>

    <!-- Ops Panel -->
    <div class="ops-panel">
      <div class="ops-panel__section-title">扫描操作</div>
      <button class="ops-btn" id="continueScanBtn" onclick="continueScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="14" rx="2"/><circle cx="12" cy="17" r="1"/></svg>
        补扫剩余学生
      </button>
      <button class="ops-btn ops-btn--has-help" id="reorderBtn" onclick="reorderStudents()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        重新排序
        <span class="help-tip-inline">
          ?
          <span class="help-tip-inline__bubble">通过扫描识别考号给学生重新确定打印顺序，不会影响已经识别的分数</span>
        </span>
      </button>
      <button class="ops-btn" id="newScanTaskBtn" onclick="newScanTask()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建扫描任务
      </button>

      <div class="ops-panel__section-title">答案与评分要求</div>
      <button class="ops-btn ops-btn--with-bubble" id="answerConfigBtn" onclick="window.location.href='homework-answer-config.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        设置答案
        <span class="btn-bubble" id="answerReminderHint">💡 未设答案，无法智能批改</span>
      </button>

      <div class="ops-panel__section-title">数据与记录</div>
      <button class="ops-btn" onclick="viewHistory()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        历史扫描记录
      </button>
      <button class="ops-btn" onclick="window.location.href='assignment-report.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        数据分析报告
      </button>

    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer__left">
      <span>已选择 <strong id="footerSelectedCount">0</strong> 份</span>
      <span style="color:var(--text-muted);">|</span>
      <span>已扫描 <span id="footerScannedTotal">0</span>/<span id="footerClassTotal">85</span> 人</span>
      <span style="color:var(--text-muted);">|</span>
      <span>已上传 <strong id="footerUploadedCount" style="color:var(--color-success-700);">0</strong> 人</span>
      <span style="color:var(--text-muted);">|</span>
      <span>已打印 <strong id="footerPrintedCount" style="color:var(--color-success-700);">0</strong> 人</span>
    </div>
    <div class="footer__actions">
      <button class="btn btn-outline-danger" id="batchAnomalyBtn" disabled onclick="batchHandleAnomaly()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        批量处理异常 <span class="btn-anomaly-count" id="batchAnomalyCount">0</span>
      </button>
      <button class="btn btn-primary" id="footerPrintBtn" disabled onclick="printSelected()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        打印所选学生
      </button>
    </div>
  </div>
</div>

<!-- Anomaly Modal -->
<div class="modal-overlay" id="anomalyModal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title">
        <span class="anomaly-icon">!</span>
        扫描异常处理
      </div>
      <button class="modal__close" onclick="closeAnomalyModal()">&times;</button>
    </div>
    <div class="modal__body">
      <div class="modal__image-area">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        试卷扫描图像预览
      </div>
      <div class="modal__info">
        <div class="modal__info-row"><span class="modal__info-label">学生姓名</span><span class="modal__info-value" id="modalStudentName">--</span></div>
        <div class="modal__info-row"><span class="modal__info-label">关联作业</span><span class="modal__info-value" id="modalAssignment">--</span></div>
        <div class="modal__info-row"><span class="modal__info-label">异常类型</span><span class="modal__info-value modal__info-value--anomaly" id="modalAnomalyType">--</span></div>
        <div class="modal__anomaly-desc" id="modalAnomalyDesc"></div>
        <div class="modal__actions-row" id="modalActions">
          <button class="modal__action-chip" onclick="selectAnomalyAction(this,'retry')">重新识别</button>
          <button class="modal__action-chip" onclick="selectAnomalyAction(this,'manual')">手动录入</button>
          <button class="modal__action-chip" onclick="selectAnomalyAction(this,'skip')">跳过</button>
          <button class="modal__action-chip" onclick="selectAnomalyAction(this,'rescan')">重新扫描</button>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn-sm btn-sm--ghost" onclick="closeAnomalyModal()">取消</button>
      <button class="btn-sm btn-sm--primary" onclick="confirmAnomalyAction()">确认处理</button>
    </div>

</div>

  // By default, all classes and assignments are active (included)
  const activeClassIds = new Set(classData.map(c => c.id));
  const activeAssignments = new Set(assignments.map(a => a.name));

  function isCardActive(item) {
    const classOk = activeClassIds.has(item.student.classId);
    const assignmentOk = !item.student.assignment || activeAssignments.has(item.student.assignment);
    return classOk && assignmentOk;
  }

  function toggleClassFilter(classId) {
    if (activeClassIds.has(classId)) {
      if (activeClassIds.size <= 1) {
        showToast('至少需要保留一个班级');
        return;
      }
      activeClassIds.delete(classId);
    } else {
      activeClassIds.add(classId);
    }
    // Deselect cards that are now filtered out
    scanStates.forEach(item => {
      if (!isCardActive(item)) item.selected = false;
    });
    renderAll();
  }

  function toggleAssignmentFilter(assignmentName) {
    if (activeAssignments.has(assignmentName)) {
      if (activeAssignments.size <= 1) {
        showToast('至少需要保留一个作业类型');
        return;
      }
      activeAssignments.delete(assignmentName);
    } else {
      activeAssignments.add(assignmentName);
    }
    // Deselect cards that are now filtered out
    scanStates.forEach(item => {
      if (!isCardActive(item)) item.selected = false;
    });
    renderAll();

  function resetFilters() {
    classData.forEach(c => activeClassIds.add(c.id));
    assignments.forEach(a => activeAssignments.add(a.name));

  // ===== Render Class Badges =====
  function renderClassBadges() {
    // Count scanned students per class
    // Use Sets to deduplicate — one student may have multiple scans across assignments
    const scannedByClass = {};
    const unscannedByClass = {};
    const scannedNamesByClass = {}; // dedup: track unique student names per class
    classData.forEach(c => { scannedByClass[c.id] = 0; unscannedByClass[c.id] = 0; scannedNamesByClass[c.id] = new Set(); });

    scanStates.forEach(item => {
      if (!isCardActive(item)) return; // respect both class and assignment filters
      const cid = item.student.classId;
      const name = item.student.name;
      if (cid !== undefined && scannedNamesByClass[cid]) {
        if (!scannedNamesByClass[cid].has(name)) {
          scannedNamesByClass[cid].add(name);
          scannedByClass[cid]++;
        }
      }
    });
    unscannedStates.forEach(item => {
      const cid = item.student.classId;
      if (cid && unscannedByClass[cid] !== undefined) unscannedByClass[cid]++;
    });

    document.getElementById('classBadges').innerHTML = classData.map(c => {
      const scanned = scannedByClass[c.id] || 0;
      const total = c.total;
      const isActive = activeClassIds.has(c.id);
      const inactiveClass = isActive ? '' : ' class-badge--inactive';
      return `<div class="class-badge${inactiveClass}" onclick="toggleClassFilter(${c.id})" title="${isActive ? '点击排除此班级' : '点击恢复此班级'}">
        <span class="class-badge__dot"></span>
        ${c.name}
        <span class="class-badge__count">（${scanned}/${total}人）</span>
      </div>`;
    }).join('');
  }

  // ===== Render Assignment Badges w/ inline color legend =====
  function renderAssignmentBadges() {
    // Dynamic count: respect class filter, deduplicate student names per assignment
    const scannedByAssignment = {};
    const scannedNamesByAssignment = {};
    assignments.forEach(a => { scannedByAssignment[a.name] = 0; scannedNamesByAssignment[a.name] = new Set(); });

    scanStates.forEach(item => {
      if (!isCardActive(item)) return; // respect both class and assignment filters
      const aname = item.student.assignment;
      const sname = item.student.name;
      if (aname && scannedNamesByAssignment[aname]) {
        if (!scannedNamesByAssignment[aname].has(sname)) {
          scannedNamesByAssignment[aname].add(sname);
          scannedByAssignment[aname]++;
        }
      }
    });

    const badges = assignments.map(a => {
      const ac = assignmentColors[a.name];
      const isActive = activeAssignments.has(a.name);
      const count = scannedByAssignment[a.name] || 0;
      const inactiveClass = isActive ? '' : ' assignment-badge--inactive';
      const inlineStyle = isActive ? `style="background:${ac.bg};border-color:${ac.border};"` : '';
      const dotStyle = isActive ? `style="background:${ac.color};"` : '';
      const nameStyle = isActive ? `style="color:${ac.color};"` : '';
      return `<div class="assignment-badge${inactiveClass}" ${inlineStyle} onclick="toggleAssignmentFilter('${a.name.replace(/'/g, "\\'")}')" title="${isActive ? '点击排除此作业' : '点击恢复此作业'}">
        <span class="assignment-badge__dot" ${dotStyle}></span>
        <span class="assignment-badge__name" ${nameStyle}>${a.name}</span>
        <span class="assignment-badge__count">${count} 张</span>
      </div>`;
    }).join('');

    document.getElementById('assignmentList').innerHTML = badges;
  }

  function renderAll() {
    renderScannedCards();
    renderUnscannedCards();
    updateSelectionUI();
    updateProgressStats();
    updateOpsButtons();
    renderClassBadges();

  function renderScannedCards() {
    const grid = document.getElementById('scannedGrid');
    grid.innerHTML = '';
    scanStates.forEach(item => createCard(item, grid, true));
  }

  function renderUnscannedCards() {
    const grid = document.getElementById('unscannedGrid');
    grid.innerHTML = '';
    unscannedStates.forEach(item => createUnscannedCard(item, grid));
  }

  function createCard(item, grid, isScanned) {
    const div = document.createElement('div');
    div.className = 'student-card';
    // Check filter state first
    const filtered = !isCardActive(item);
    if (filtered) div.classList.add('student-card--filtered');
    const ac = assignmentColors[item.student.assignment];
    if (ac) div.classList.add(ac.css);
    if (item.selected && !filtered) div.classList.add('student-card--selected');
    if (item.student.anomaly && item.student.status==='done') div.classList.add('student-card--anomaly');
    if (item.printed) div.classList.add('student-card--printed');
    div.dataset.id = item.id;

    const st = item.student.status;

    // Spinner for in-progress recognition (no selection possible)
    if (st==='recognizing') {
      const spin = document.createElement('span');
      spin.className = 'student-card__spinner';
      div.appendChild(spin);
    }

    // Name — hide for anomaly types where student identity is unknown
    const hideName = item.student.anomaly && (item.student.anomaly === '考号关联异常' || item.student.anomaly === '扫描异常');
    if (!hideName) {
      const nameSpan = document.createElement('span');
      nameSpan.className = 'student-card__name';
      if (st==='recognizing') {
        const pct = item._recognitionProgress || 0;
        nameSpan.textContent = `识别中 ${pct}%`;
      } else {
        nameSpan.textContent = item.student.name;
      }
      div.appendChild(nameSpan);
    } else {
      // Spacer to push tags into position when name is hidden
      const spacer = document.createElement('span');
      spacer.className = 'student-card__spacer';
      div.appendChild(spacer);
    }

    // Tags: anomaly type + grading progress + printed indicator
    if (item.student.anomaly && item.student.status==='done') {
      const et = document.createElement('span');
      et.className = 'student-card__tag student-card__tag--anomaly';
      // Short label for narrow cards; full text in tooltip
      const shortLabels = { '考号关联异常':'考号异常', '扫描异常':'扫描异常', '二维码异常':'二维码异常', '重复扫描':'重复扫描' };
      et.textContent = shortLabels[item.student.anomaly] || item.student.anomaly;
      et.title = item.student.anomaly + ' — 点击查看详情';
      et.style.cursor = 'pointer';
      et.addEventListener('click',(e)=>{
        e.stopPropagation();
        goToAnomaly(item.student.anomaly, item.student.name);
      });
      div.appendChild(et);
    }
    if (item._gradingProgress != null && item._gradingProgress < 100 && item.student.status==='done') {
      const gt = document.createElement('span');
      gt.className = 'student-card__tag student-card__tag--grading';
      gt.textContent = `批改 ${item._gradingProgress}%`;
      gt.title = '存在未设置答案的题目，批改未完成';
      div.appendChild(gt);
    }
    if (item.printed) {
      // Corner badge shown via CSS ::after; add title for accessibility
      div.title = '已打印';
    }

    // Detail button "›" — only for non-anomaly done cards
    if (st==='done' && !item.student.anomaly) {
      const detailBtn = document.createElement('button');
      detailBtn.className = 'student-card__detail';
      detailBtn.textContent = '›';
      detailBtn.title = '查看试卷详情';
      detailBtn.addEventListener('click',(e)=>{
        e.stopPropagation();
        window.location.href = `student-preview.html?name=${encodeURIComponent(item.student.name)}`;
      });
      div.appendChild(detailBtn);
    }

    // Whole card click → toggle selection (for scannable cards)
    div.addEventListener('click',(e)=>{
      // Don't toggle if clicking the detail button or while recognizing
      if (e.target.classList.contains('student-card__detail')) return;
      if (st==='recognizing') return;
      toggleItem(item);
    });

    grid.appendChild(div);
  }

  function createUnscannedCard(item, grid) {
    const div = document.createElement('div');
    div.className = 'student-card student-card--unscanned';
    // Check filter state (unscanned cards only have classId)
    if (!activeClassIds.has(item.student.classId)) {
      div.classList.add('student-card--filtered');
    }
    const dot = document.createElement('span');
    dot.style.cssText = 'width:14px;height:14px;border-radius:50%;flex-shrink:0;background:var(--color-gray-100);';
    div.appendChild(dot);
    const ns = document.createElement('span'); ns.textContent = item.student.name;
    div.appendChild(ns);
    grid.appendChild(div);
  }

  // ===== Selection =====
  function toggleItem(item) {
    item.selected=!item.selected; renderAll();
  }
  function toggleSelectAll() {
    // Toggle all done students that pass the active filters (including printed and anomaly)
    const sel = scanStates.filter(s => s.student.status==='done' && isCardActive(s));
    const all = sel.length > 0 && sel.every(s=>s.selected);
    sel.forEach(s=>s.selected=!all);
    renderAll();
  }

  function updateSelectionUI() {
    const selCount = scanStates.filter(s=>s.selected).length;
    document.getElementById('footerSelectedCount').textContent = selCount;
    document.getElementById('footerScannedTotal').textContent = scannedCount;
    document.getElementById('footerUploadedCount').textContent = uploadedCount;
    const totalStudents = classData.reduce((sum, c) => sum + c.total, 0);
    document.getElementById('footerClassTotal').textContent = totalStudents;

    // Print button: enabled when selection exists (mismatch warning only on click)
    const hasSel = selCount > 0;
    document.getElementById('footerPrintBtn').disabled = !hasSel;

    const ac = scanStates.filter(s=>s.student.anomaly).length;
    const hasAnomaly = ac > 0;
    document.getElementById('batchAnomalyBtn').disabled = !hasAnomaly;
    document.getElementById('batchAnomalyCount').textContent = ac;

    // Printed count for footer
    const printedCount = scanStates.filter(s=>s.printed).length;
    document.getElementById('footerPrintedCount').textContent = printedCount;

    const selectable = scanStates.filter(s=>s.student.status==='done' && isCardActive(s));
    const allSelected = selectable.length>0 && selectable.every(s=>s.selected);
    document.getElementById('sectionSelectAll').textContent = allSelected?'取消全选':'全选';

    document.getElementById('scannedCountLabel').textContent = `${scanStates.length} 人`;
    document.getElementById('unscannedCountLabel').textContent = `${unscannedStates.length} 人`;

    // Anomaly count tag next to scanned header
    const tag = document.getElementById('anomalyCountTag');
    if (ac>0) { tag.style.display='inline-flex'; tag.textContent=`${ac} 异常`; }
    else tag.style.display='none';

    // Show/hide reset filter link
    const hasFilter = activeClassIds.size < classData.length || activeAssignments.size < assignments.length;
    const resetLink = document.getElementById('filterResetLink');
    if (resetLink) {
      resetLink.style.display = hasFilter ? 'inline' : 'none';
      if (hasFilter) {
        const hiddenCount = scanStates.filter(s => !isCardActive(s)).length + unscannedStates.filter(s => !activeClassIds.has(s.student.classId)).length;
        resetLink.textContent = `↺ 重置筛选（${hiddenCount}人已隐藏）`;
      }
    }
  }

  function updateProgressStats() {
    document.getElementById('scannedNum').textContent = scannedCount;
    const uploadedEl = document.getElementById('uploadedNum');
    uploadedEl.textContent = uploadedCount;

    // When upload is behind, highlight the uploaded count in red
    if (hasUploadMismatch()) {
      uploadedEl.style.color = 'var(--color-error-700)';
    } else {
      uploadedEl.style.color = '';
    }

    const allDone = scanStates.length >= studentQueue.length && scanStates.every(s => s.student.status === 'done');
    document.getElementById('flipOrderBtn').disabled = !allDone;
  }

  function flipCardOrder() {
    scanStates.reverse();
    renderAll();
    showToast('卡片顺序已翻转');
  }

  // ===== Anomaly Modal =====
  let currentAnomalyItem = null;

  function openAnomalyModal(item) {
    currentAnomalyItem=item;selectedAction=null;
    document.getElementById('modalStudentName').textContent=item.student.name;
    document.getElementById('modalAssignment').textContent=item.student.assignment||'--';
    document.getElementById('modalAnomalyType').textContent=item.student.anomaly;
    document.getElementById('modalAnomalyDesc').textContent = anomalyDescriptions[item.student.anomaly]||`检测到异常：${item.student.anomaly}。请选择处理方式。`;
    document.querySelectorAll('#modalActions .modal__action-chip').forEach(c=>c.classList.remove('modal__action-chip--selected'));
    document.getElementById('anomalyModal').classList.add('modal-overlay--visible');
  }

  const anomalyDescriptions = {
    '扫描异常':'扫描过程中设备出现异常，图像数据不完整或损坏。请检查扫描仪连接状态后重新扫描该试卷。',
    '二维码异常':'试卷上的二维码无法正常识别，可能是二维码污损、折叠或打印不清晰导致。请手动核对考号信息。',
    '考号关联异常':'识别出的考号在系统中找不到对应学生，无法自动关联。可能是考号填写错误或学生信息未录入系统。',
    '重复扫描':'该试卷已被扫描过，系统中已存在相同考号的记录。请确认是否为重复放入，或检查考号是否与其他学生重复。',
  };

  function selectAnomalyAction(chip,action){
    selectedAction=action;
    document.querySelectorAll('#modalActions .modal__action-chip').forEach(c=>c.classList.remove('modal__action-chip--selected'));
    chip.classList.add('modal__action-chip--selected');
  }

  function confirmAnomalyAction(){
    if(!selectedAction){showToast('请先选择一种处理方式');return;}
    if(!currentAnomalyItem)return;
    const labels={retry:'已重新提交识别',manual:'已标记为手动录入',skip:'已跳过此页',rescan:'已加入重新扫描队列'};
    if(selectedAction==='retry'){
      currentAnomalyItem.student.anomaly=null;
      currentAnomalyItem.student.status='recognizing';
      currentAnomalyItem._recognitionProgress=0;
      renderAll();
      setTimeout(()=>{currentAnomalyItem._recognitionProgress=30;renderAll();},375);
      setTimeout(()=>{currentAnomalyItem._recognitionProgress=70;renderAll();},850);
      setTimeout(()=>{currentAnomalyItem.student.status='done';currentAnomalyItem._recognitionProgress=100;renderAll();},1250);
    }
    else{currentAnomalyItem.student.anomaly=null;}
    closeAnomalyModal();renderAll();
    showToast(`${labels[selectedAction]}：${currentAnomalyItem.student.name}`);
  }

  function closeAnomalyModal(){document.getElementById('anomalyModal').classList.remove('modal-overlay--visible');currentAnomalyItem=null;selectedAction=null;}
  // Anomaly type → anomaly-handling category key mapping
  const anomalyTypeToKey = {'扫描异常':'scan','二维码异常':'qrcode','考号关联异常':'examNo','重复扫描':'duplicate'};

  function goToAnomaly(anomalyType, studentName) {
    const key = anomalyTypeToKey[anomalyType] || 'scan';
    let url = `anomaly-handling.html?type=${key}`;
    if (studentName) url += `&student=${encodeURIComponent(studentName)}`;
    window.location.href = url;
  }

  function batchHandleAnomaly(){
    const firstAnomaly = scanStates.find(s=>s.student.anomaly);
    const key = firstAnomaly ? (anomalyTypeToKey[firstAnomaly.student.anomaly]||'scan') : 'scan';
    window.location.href = `anomaly-handling.html?type=${key}`;
  }

  // ===== Operations =====
  let isContinueScanning = false;   // true while "补扫" is running
  let continueQueue = [];           // students yet to be scanned by continueScan

  // ===== Scan/Upload tracking (server-side data) =====
  let scannedCount = 0;   // papers fed through scanner
  let uploadedCount = 0;  // papers received by server
  let pendingScanCount = 0; // currently scanning (not yet uploaded)

  function isScanning() {
    // Active scanning: timer running, papers pending upload, or cards still recognizing
    return scanTimer !== null || isContinueScanning || pendingScanCount > 0 ||
           scanStates.some(s => s.student.status === 'recognizing');
  }

  function hasUploadMismatch() {
    return scannedCount > uploadedCount;
  }

  function updateOpsButtons() {
    const scanning = isScanning();
    const noUnscanned = unscannedStates.length === 0;

    // Lock all operation buttons during active scanning
    ['continueScanBtn','reorderBtn','newScanTaskBtn'].forEach(id => {
      const btn = document.getElementById(id);
      if (!btn) return;
      if (scanning) {
        btn.classList.add('ops-btn--disabled');
      } else {
        btn.classList.remove('ops-btn--disabled');
      }
    });

    // Also lock footer buttons during scanning
    const printBtn = document.getElementById('footerPrintBtn');
    const batchBtn = document.getElementById('batchAnomalyBtn');
    if (scanning) {
      if (printBtn) { printBtn.disabled = true; printBtn.title = '扫描进行中，完成后可打印'; }
      if (batchBtn) batchBtn.disabled = true;
    }
    // When not scanning, let updateSelectionUI handle these

    // Disable continue scan if nothing left
    const continueBtn = document.getElementById('continueScanBtn');
    if (noUnscanned && !scanning) {
      continueBtn.classList.add('ops-btn--disabled');
    }

    // Lock back button during scanning
    const backBtn = document.querySelector('.header__back');
    if (backBtn) {
      if (scanning) {
        backBtn.style.pointerEvents = 'none';
        backBtn.style.opacity = '0.4';
      } else {
        backBtn.style.pointerEvents = '';
        backBtn.style.opacity = '';
      }
    }
  }

  function continueScan() {
    if (isScanning()) { showToast('扫描正在进行中，请等待完成'); return; }
    if (unscannedStates.length === 0) { showToast('所有学生均已扫描完毕'); return; }

    // Take up to 5 students from unscanned list for this batch
    const batchSize = Math.min(5, unscannedStates.length);
    continueQueue = unscannedStates.splice(0, batchSize).map(u => ({
      name: u.student.name,
      classId: u.student.classId,
      // Assign a random assignment from the available list
      assignment: assignments[Math.floor(Math.random() * assignments.length)].name,
      anomaly: Math.random() < 0.12 ? errorTypes[Math.floor(Math.random() * errorTypes.length)] : null,
    }));

    isContinueScanning = true;
    showToast(`正在扫描 ${batchSize} 份试卷…`);
    startContinueScan();
  }

  function startContinueScan() {
    if (continueQueue.length === 0) {
      isContinueScanning = false;
      renderAll();
      if (unscannedStates.length > 0) {
        showToast('补扫完成，仍有未扫描学生可继续补扫');
      } else {
        showToast('全部学生扫描完成');
      }
      return;
    }

    const tmpl = continueQueue.shift();

    // Paper scanned — count, no card yet
    scannedCount++;
    pendingScanCount++;
    renderAll();

    // Each card independently uploads
    setTimeout(() => {
      pendingScanCount--;
      uploadedCount++;

      const id = scanIdCounter++;
      const item = {
        id: id,
        student: {
          name: tmpl.name,
          classId: tmpl.classId,
          assignment: tmpl.assignment,
          status: 'recognizing',
          anomaly: null,
        },
        selected: false,
        isScanned: true,
        printed: false,
        _finalAnomaly: tmpl.anomaly,
        _recognitionProgress: 0,
      };
      scanStates.push(item);
      renderAll();

      setTimeout(() => { item._recognitionProgress = 30; renderAll(); }, 450);
      setTimeout(() => { item._recognitionProgress = 70; renderAll(); }, 900);
      setTimeout(() => {
        item.student.status = 'done';
        item._recognitionProgress = 100;
        item.student.anomaly = item._finalAnomaly;
        delete item._finalAnomaly;
        item.selected = true; // All cards auto-selected after recognition (including anomaly)
        renderAll();
        if (scanStates.length === 1) showAnswerReminderBubble();
      }, 1350);
    }, 900);

    // Queue next paper immediately (parallel — don't wait for upload)
    setTimeout(startContinueScan, 600);
  }

  function newScanTask(){window.location.href='scan-class-select.html';}
  function viewHistory(){window.location.href='scan-history.html';}
  function reorderStudents(){showToast('正在通过扫描识别考号重新确定打印顺序…');}
  function printSelected(){
    const s=scanStates.filter(st=>st.selected);
    if(!s.length){showToast('请先选择需要打印的学生');return;}

    // Warn if upload mismatch — some papers scanned but not yet on server
    if (hasUploadMismatch()) {
      const diff = scannedCount - uploadedCount;
      if (!confirm(`⚠ 还有 ${diff} 张试卷尚未上传完成。\n\n请确认已将未上传的试卷从打印机中取走，否则会打印错误内容。\n\n点击"确定"继续打印已上传识别的学生，点击"取消"等待上传完成。`)) {
        return;
      }
    }

    // Store selection in sessionStorage and navigate to print-settings
    sessionStorage.setItem('printSelectedNames', JSON.stringify(s.map(st => st.student.name)));
    sessionStorage.setItem('printSelectedCount', s.length);
    const anomalyCount = s.filter(st => st.student.anomaly).length;
    sessionStorage.setItem('printAnomalyCount', anomalyCount);

    window.location.href = 'print-settings.html';
  }

  // ===== Simulate parallel scan processing =====
  // Scanner feeds papers continuously; each paper independently uploads → recognizes
  let scanTimer = null;

  function hideLoading(){
    document.getElementById('loadingOverlay').classList.add('loading-overlay--hidden');
    setTimeout(()=>{const el=document.getElementById('loadingOverlay');if(el)el.remove();},500);
  }

  function startParallelScan() {
    if (scanTimer) return; // already running
    scanTimer = setInterval(() => {
      if (queueIdx >= studentQueue.length) {
        clearInterval(scanTimer);
        scanTimer = null;
        return;
      }
      scanOneCard();
    }, 600); // paper feeds every 600ms
  }

  function scanOneCard() {
    const tmpl = studentQueue[queueIdx];
    queueIdx++;

    // Paper scanned — count immediately, no card yet
    scannedCount++;
    pendingScanCount++;
    renderAll();

    // Each card independently uploads after ~900ms (simulate network)
    setTimeout(() => {
      pendingScanCount--;
      uploadedCount++;

      // Remove matching unscanned student
      const unscannedIdx = unscannedStates.findIndex(u => u.student.classId === tmpl.classId);
      if (unscannedIdx >= 0) { unscannedStates.splice(unscannedIdx, 1); }
      else if (unscannedStates.length > 0) { unscannedStates.shift(); }

      const id = scanIdCounter++;
      const item = {
        id: id,
        student: {
          name: tmpl.name,
          classId: tmpl.classId,
          assignment: tmpl.assignment,
          status: 'recognizing',
          anomaly: null,
        },
        selected: false,
        isScanned: true,
        printed: false,
        _finalAnomaly: tmpl.anomaly,
        _gradingProgress: tmpl._gradingProgress || null,
        _recognitionProgress: 0,
      };
      scanStates.push(item);
      renderAll();

      // Recognition progress (independent per card)
      setTimeout(() => { item._recognitionProgress = 30; renderAll(); }, 450);
      setTimeout(() => { item._recognitionProgress = 70; renderAll(); }, 900);
      setTimeout(() => {
        item.student.status = 'done';
        item._recognitionProgress = 100;
        item.student.anomaly = item._finalAnomaly;
        delete item._finalAnomaly;
        item.selected = true; // All cards auto-selected after recognition (including anomaly)
        renderAll();
        if (scanStates.length === 1) showAnswerReminderBubble();
      }, 1350);
    }, 900);
  }

  // Single-assignment modes (free/designated): hide color legend, show task name
  const urlParams = new URLSearchParams(window.location.search);
  const isFreeMode = urlParams.get('mode') === 'free';
  const isDesignatedMode = urlParams.get('mode') === 'designated';
  if (isFreeMode || isDesignatedMode) {
    document.getElementById('assignmentDivider').style.display = 'none';
    document.getElementById('assignmentLegend').style.display = 'none';
    document.getElementById('assignmentList').style.display = 'none';
    document.getElementById('reorderBtn').style.display = 'none';
    const taskName = urlParams.get('taskName') || (isFreeMode ? '自由作业' : '指定作业扫描');
    const freeLabel = document.getElementById('freeTaskLabel');
    freeLabel.style.display = 'inline';
    freeLabel.textContent = (isFreeMode ? '📝 ' : '📋 ') + taskName;
  }

  // Loading: only show on first entry (from scan-class-select), not when returning from other pages
  const isFirstEntry = urlParams.get('first') === '1';
  if (isFirstEntry) {
    setTimeout(hideLoading, 2250);
    setTimeout(startParallelScan, 2300);
  } else {
    // Skip loading — immediately hide overlay and populate all cards
    hideLoading();
    // Simulate: some students already printed (first ~35% of non-anomaly students)
    let printedAssigned = 0;
    const nonAnomalyTotal = studentQueue.filter(s => !s.anomaly).length;
    const printedTarget = Math.floor(nonAnomalyTotal * 0.35);

    while (queueIdx < studentQueue.length) {
      const tmpl = studentQueue[queueIdx];
      queueIdx++;

      // Remove matching unscanned student
      const uIdx = unscannedStates.findIndex(u => u.student.classId === tmpl.classId);
      if (uIdx >= 0) { unscannedStates.splice(uIdx, 1); }
      else if (unscannedStates.length > 0) { unscannedStates.shift(); }

      const hasAnomaly = !!tmpl.anomaly;
      const shouldBePrinted = !hasAnomaly && printedAssigned < printedTarget;
      if (shouldBePrinted) printedAssigned++;

      scanStates.push({
        id: scanIdCounter++,
        student: { name: tmpl.name, classId: tmpl.classId, assignment: tmpl.assignment, status: 'done', anomaly: tmpl.anomaly },
        // All non-printed cards auto-selected; printed cards deselected
        selected: !shouldBePrinted,
        isScanned: true,
        printed: shouldBePrinted,
      });
    }
    // All already scanned and uploaded (returning to page = server data already synced)
    scannedCount = studentQueue.length;
    uploadedCount = studentQueue.length;
    renderAll();

    // Check for pending print confirmation from print-settings
    const pendingPrint = sessionStorage.getItem('pendingPrint');
    if (pendingPrint === 'true') {
      const printNames = JSON.parse(sessionStorage.getItem('printSelectedNames') || '[]');
      const normalCards = [];
      const anomalyCards = [];
      scanStates.forEach(st => {
        if (printNames.includes(st.student.name)) {
          st.printed = true;
          st.selected = false;
          if (st.student.anomaly) anomalyCards.push(st);
          else normalCards.push(st);
        }
      });
      sessionStorage.removeItem('pendingPrint');
      sessionStorage.removeItem('printSelectedNames');
      sessionStorage.removeItem('printSelectedCount');
      sessionStorage.removeItem('printAnomalyCount');
      renderAll();

      const total = normalCards.length + anomalyCards.length;
      let msg = `已打印 ${total} 份`;
      if (normalCards.length > 0 && anomalyCards.length > 0) {
        msg += `（${normalCards.length} 份正常打印，${anomalyCards.length} 份异常卡片扫描仪过纸未打印内容）`;
      } else if (anomalyCards.length > 0) {
        msg += `（${anomalyCards.length} 份均为异常卡片，扫描仪已过纸，未打印具体内容）`;
      }
      showToast(msg);
    }
  }

  function showToast(msg){const e=document.querySelector('.toast');if(e)e.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.classList.add('toast--out');setTimeout(()=>t.remove(),200);},2400);}

  function showAnswerReminderBubble(){
    const hint=document.getElementById('answerReminderHint');
    if(hint)hint.classList.add('btn-bubble--visible');
  }

  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAnomalyModal();if(e.ctrlKey&&e.key==='a'){e.preventDefault();toggleSelectAll();}});

  // ===== Estimated grading completion time (智能批改后台排队) =====
  let gradingEtaMinutes = 5;
  function tickGradingEta() {
    if (gradingEtaMinutes <= 0) return;
    gradingEtaMinutes--;
    const minEl = document.getElementById('gradingEtaMin');
    const textEl = document.getElementById('gradingEtaText');
    if (gradingEtaMinutes > 0) {
      if (minEl) minEl.textContent = gradingEtaMinutes;
    } else if (textEl) {
      textEl.textContent = '批改即将完成';
    }
  }
  setInterval(tickGradingEta, 60000); // 每分钟递减一次预计批改时间

  renderAll();
</script>
</body>
</html>
