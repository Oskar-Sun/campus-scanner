<script>
// ===== Mock Data =====
const CLASS_NAMES=['高一·1班','高一·2班','高一·3班'];
const studentNames=['张三','李四','王五','赵六','钱七','孙八','周九','吴十','郑十一','王小明','李小华','张大伟','刘洋','陈芳','杨柳','黄同学','林同学','何同学','郭同学','马同学','罗同学','梁同学','宋同学','唐同学','韩同学','冯同学','董同学','程同学','曹同学','袁同学','邓同学','许同学','傅同学','沈同学','曾同学','彭同学','吕同学','苏同学','蒋同学','蔡同学'];

function generateStudents(){
  const students=[];
  for(let c=0;c<3;c++){
    const size=38+c*2;
    const unsub=c===0?['张三','王五']:(c===1?['陈芳','黄同学','林同学']:['梁同学','沈同学']);
    const uset=new Set(unsub);
    for(let i=0;i<size;i++){
      const name=studentNames[i]||`学生${c+1}-${i+1}`;
      const sub=!uset.has(name);
      const scores=[];
      if(sub){
        const qs=[4,4,4,4,4,4,4,4,4,4,6,8,8,10,10];let seed=c*100+i*7+13;
        for(let q=0;q<15;q++){const r=((seed*(q+3)+q*17)%100)/100;scores.push(q<10?(r<0.78?qs[q]:0):Math.max(0,Math.round(qs[q]*(0.3+r*0.7))));seed+=1;}
      }else{for(let q=0;q<15;q++)scores.push(null);}
      students.push({name,classIdx:c,submitted:sub,scores,total:sub?scores.reduce((a,b)=>a+(b||0),0):null});
    }
  }
  return students;
}

// ===== Score-rate grade thresholds (draggable) =====
let gradeThresholds = { bad: 0.60, mid: 0.75, good: 0.85 }; // 差<60%, 中<75%, 良<85%, 优≥85%
function getGradeLabel(rate) {
  if (rate >= gradeThresholds.good) return '优';
  if (rate >= gradeThresholds.mid) return '良';
  if (rate >= gradeThresholds.bad) return '中';
  return '差';
}
function getGradeColor(rate) {
  if (rate >= gradeThresholds.good) return 'var(--color-success-700)';
  if (rate >= gradeThresholds.mid) return 'var(--color-accent-1-800)';
  if (rate >= gradeThresholds.bad) return 'var(--color-warning-700)';
  return 'var(--color-error-700)';
}
function getGradeBg(rate) {
  if (rate >= gradeThresholds.good) return 'var(--color-success-100)';
  if (rate >= gradeThresholds.mid) return 'var(--color-accent-1-50)';
  if (rate >= gradeThresholds.bad) return 'var(--color-warning-100)';
  return 'var(--color-error-100)';
}

function getFilteredStudents(){const ix=getFilteredClassIndices();return allStudents.filter(s=>ix.includes(s.classIdx));}
function getStudentsByClass(ci){return allStudents.filter(s=>s.classIdx===ci);}
function getSubmitted(s){return s.filter(x=>x.submitted);}
function getUnsubmitted(s){return s.filter(x=>!x.submitted);}
function getQuestionStats(students,qi){
  const sub=getSubmitted(students);const q=questions[qi];let corr=0,ts=0;
  sub.forEach(s=>{const sc=s.scores[qi];if(sc!==null){ts+=sc;if(sc===q.score)corr++;}});
  return{avg:sub.length>0?ts/sub.length:0,rate:q.score>0?(sub.length>0?ts/sub.length:0)/q.score:0,correctRate:sub.length>0?corr/sub.length:0,total:sub.length,correct:corr};
}
function getClassAvg(s){const sub=getSubmitted(s);return sub.length>0?sub.reduce((a,x)=>a+(x.total||0),0)/sub.length:0;}
function getGradeStudents(){return[0,1,2].flatMap(ci=>getStudentsByClass(ci));}

      // Cross-class per-question
      const isTeacher=currentRole==='teacher';
      h+=`<div class="section"><div class="section__header"><span class="section__title">🏫 各班小题得分率</span><span class="section__badge">${isTeacher?'我的班级':'全年级'}</span></div>
        <div class="table-wrap"><table><tr><th>题号</th><th>知识点</th><th>满分</th>${compareIndices.map(ci=>`<th>${CLASS_NAMES[ci]}</th>`).join('')}<th>年级</th></tr>`;
      questions.forEach((q,i)=>{h+=`<tr><td><strong>${q.no}</strong></td><td class="text-left">${q.knowledge}</td><td>${q.score}</td>`;compareIndices.forEach(ci=>{const cs=getQuestionStats(getStudentsByClass(ci),i);h+=`<td style="font-weight:600;color:${getGradeColor(cs.rate)}">${(cs.rate*100).toFixed(0)}%</td>`;});const gs=getQuestionStats(gradeStudents,i);h+=`<td>${(gs.rate*100).toFixed(0)}%</td></tr>`;});
      h+=`</table></div></div>`;
    } else {
      h+=`<div style="text-align:center;padding:40px;color:var(--text-muted);">请选择「全部班级」查看班级横向对比</div>`;
    }
  }

  else if(currentAnalysisSubtab==='students'){
    const submitted=getSubmitted(students).sort((a,b)=>(b.total||0)-(a.total||0));
    h+=`<div class="section"><div class="section__header"><span class="section__title">👤 学生成绩（按总分降序）</span><span class="section__badge">${submitted.length}人</span></div>
      <div class="table-wrap"><table><tr><th>排名</th><th>姓名</th><th>班级</th>${questions.map(q=>`<th>题${q.no}<br><span style="font-weight:400;font-size:9px;">${q.score}分</span></th>`).join('')}<th>总分</th><th>得分率</th><th>原卷</th></tr>`;
    submitted.forEach((s,rank)=>{const rate=(s.total||0)/totalScore;h+=`<tr><td>${rank+1}</td><td class="text-left"><strong>${s.name}</strong></td><td>${CLASS_NAMES[s.classIdx]}</td>`;s.scores.forEach((sc,qi)=>{const q=questions[qi];const isFull=sc===q.score;const isZero=sc===0;h+=`<td class="${isFull?'cell-good':(isZero?'cell-bad':'')}">${sc!==null?sc:'-'}</td>`;});h+=`<td><strong>${s.total}</strong></td><td class="${rate>=0.8?'cell-good':(rate<0.5?'cell-bad':'')}">${(rate*100).toFixed(1)}%</td><td><a class="link-btn" href="student-preview.html?name=${encodeURIComponent(s.name)}" onclick="event.stopPropagation();">📄 原卷</a></td></tr>`;});
    h+=`</table></div></div>`;
  }

  return h;
}

// ===== Sort analysis =====
function sortAnalysis(field){
  if(analysisSort.field===field){analysisSort.dir=analysisSort.dir==='asc'?'desc':'asc';}
  else{analysisSort.field=field;analysisSort.dir='asc';}
  renderCurrentTab();
}

function toggleThreshold(){
  const panel=document.getElementById('thresholdPanel');
  if(panel)panel.classList.toggle('threshold-panel--open');
}

// ===== Threshold drag =====
function initThresholdDrag(){
  const track=document.getElementById('thresholdTrack');if(!track)return;
  const handles=track.querySelectorAll('.threshold-handle');
  handles.forEach(h=>{
    h.onmousedown=function(e){
      e.preventDefault();const key=h.dataset.key;
      function onMove(ev){
        const rect=track.getBoundingClientRect();
        let pct=Math.max(0.05,Math.min(0.95,(ev.clientX-rect.left)/rect.width));
        // Enforce order: bad < mid < good
        if(key==='bad')pct=Math.min(pct,gradeThresholds.mid-0.05);
        if(key==='mid'){pct=Math.max(pct,gradeThresholds.bad+0.05);pct=Math.min(pct,gradeThresholds.good-0.05);}
        if(key==='good')pct=Math.max(pct,gradeThresholds.mid+0.05);
        gradeThresholds[key]=Math.round(pct*100)/100;
        h.style.left=(gradeThresholds[key]*100)+'%';
        updateThresholdLabels();
      }
      function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);renderCurrentTab();}
      document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    };
    // Touch support
    h.ontouchstart=function(e){
      e.preventDefault();const key=h.dataset.key;
      function onMove(ev){
        const rect=track.getBoundingClientRect();
        let pct=Math.max(0.05,Math.min(0.95,(ev.touches[0].clientX-rect.left)/rect.width));
        if(key==='bad')pct=Math.min(pct,gradeThresholds.mid-0.05);
        if(key==='mid'){pct=Math.max(pct,gradeThresholds.bad+0.05);pct=Math.min(pct,gradeThresholds.good-0.05);}
        if(key==='good')pct=Math.max(pct,gradeThresholds.mid+0.05);
        gradeThresholds[key]=Math.round(pct*100)/100;
        h.style.left=(gradeThresholds[key]*100)+'%';
        updateThresholdLabels();
      }
      function onUp(){document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp);renderCurrentTab();}
      document.addEventListener('touchmove',onMove,{passive:false});document.addEventListener('touchend',onUp);
    };
  });
}

function updateThresholdLabels(){
  const labels=document.querySelector('.threshold-labels');
  if(labels){
    labels.innerHTML=`<span>差 &lt;${(gradeThresholds.bad*100).toFixed(0)}%</span><span>中 ${(gradeThresholds.bad*100).toFixed(0)}-${(gradeThresholds.mid*100).toFixed(0)}%</span><span>良 ${(gradeThresholds.mid*100).toFixed(0)}-${(gradeThresholds.good*100).toFixed(0)}%</span><span>优 ≥${(gradeThresholds.good*100).toFixed(0)}%</span>`;
  }
}

// ===== Tab 3: 试题讲评 =====
function renderReview(){
  const students=getFilteredStudents();const gradeStudents=getGradeStudents();
  let h='';
  h+=`<div class="download-bar"><span class="download-bar__text">📥 支持下载 PDF 课件离线讲评，或在课堂直接投屏使用</span><button class="download-bar__btn" onclick="alert('模拟下载：试题讲评课件.pdf')">⬇ 下载 PDF 课件</button></div>`;
  questions.forEach((q,i)=>{
    const stats=getQuestionStats(students,i);const gStats=getQuestionStats(gradeStudents,i);
    const grade=getGradeLabel(stats.rate);
    h+=`<div class="review-card" id="q${q.no}">
      <div class="review-card__header"><div class="review-card__no">${q.no}</div><span class="review-card__type">${q.type==='objective'?'客观题':'主观题'}</span><span style="font-size:12px;font-weight:600;">${q.knowledge}</span>
        <span class="review-card__grade-tag" style="background:${getGradeBg(stats.rate)};color:${getGradeColor(stats.rate)};">${grade}</span>
        <span class="review-card__score">满分 ${q.score} 分</span></div>
      <div class="review-card__body"><div class="review-card__stem">${q.stem}</div>`;
    if(q.options)h+=`<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;">${q.options.map(o=>`<span>${o}</span>`).join('')}</div>`;
    h+=`<div class="review-card__answer">✅ 正确答案：${q.answer}</div>
      <div class="review-card__stats"><span>班级均分：<strong>${stats.avg.toFixed(1)}</strong>/${q.score}</span><span>班级得分率：<strong style="color:${getGradeColor(stats.rate)}">${(stats.rate*100).toFixed(1)}%</strong></span>${currentRole==='head'?`<span>年级得分率：<strong>${(gStats.rate*100).toFixed(1)}%</strong></span>`:''}<span>答对：<strong>${stats.correct}/${stats.total}</strong></span></div>`;
    if(q.type==='objective'&&stats.rate<0.8){const wrong=q.options?q.options.filter(o=>!o.startsWith(q.answer)):[];h+=`<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;">🔍 常见误选：${wrong.slice(0,2).join('、')} — 学生混淆了${q.knowledge}中的易错点</div>`;}
    h+=`<div class="review-card__knowledge">📖 知识点：${q.knowledge} | 解析：${q.type==='objective'?'考查'+q.knowledge+'的理解与运用，需注意语境分析和语法规则的结合。':'考查'+q.knowledge+'的综合运用能力，评分时重点关注要点完整性和语言准确性。'}</div>
      <span class="review-card__similar" onclick="alert('跳转至相似题推荐：为「'+'${q.knowledge}'+'」匹配 3 道同类练习')">💡 推荐相似题 →</span></div></div>`;
  });
  return h;
}

// ===== Tab 5: 作文报告（嵌入 AI 作文批改报告原型） =====
function renderEssayReport(){
  return `<iframe class="essay-frame" src="../语文作文报告/index.html" title="作文报告"></iframe>`;
}

// ===== Tab 4: 知识点分析 =====
function renderKnowledge(){
  const students=getFilteredStudents();const gradeStudents=getGradeStudents();
  const kpData=knowledgePoints.map(kp=>{
    let cTotal=0,cCorrect=0,gTotal=0,gCorrect=0;
    kp.qnos.forEach(qi=>{const q=questions[qi-1];const cs=getQuestionStats(students,qi-1);const gs=getQuestionStats(gradeStudents,qi-1);cTotal+=q.score*cs.total;cCorrect+=cs.avg*cs.total;gTotal+=q.score*gs.total;gCorrect+=gs.avg*gs.total;});
    return{...kp,classRate:cTotal>0?cCorrect/cTotal:0,gradeRate:gTotal>0?gCorrect/gTotal:0};
  });
  kpData.sort((a,b)=>a.classRate-b.classRate);
  let h=`<div class="section"><div class="section__header"><span class="section__title">📚 知识点掌握情况</span><span class="section__badge">共${kpData.length}个</span></div><div class="kp-list">`;
  kpData.forEach(kp=>{
    const cp=(kp.classRate*100).toFixed(1),gp=(kp.gradeRate*100).toFixed(1);const diff=kp.classRate-kp.gradeRate;
    h+=`<div class="kp-item"><div class="kp-item__header"><span class="kp-item__name">${kp.name}</span><span class="kp-item__qnos">对应题号：${kp.qnos.map(n=>'第'+n+'题').join('、')}</span></div>
      <div class="kp-item__bars"><div class="kp-bar"><div class="kp-bar__label"><span>班级得分率</span><span><strong>${cp}%</strong></span></div><div class="kp-bar__track"><div class="kp-bar__fill kp-bar__fill--class" style="width:${cp}%"></div></div></div>
      <div class="kp-bar"><div class="kp-bar__label"><span>年级得分率</span><span><strong>${gp}%</strong><span style="font-size:9px;color:${diff>=0?'var(--color-success-700)':'var(--color-error-700)'};">${diff>=0?'↑'+Math.abs(diff*100).toFixed(1)+'%':'↓'+Math.abs(diff*100).toFixed(1)+'%'}</span></span></div><div class="kp-bar__track"><div class="kp-bar__fill kp-bar__fill--grade" style="width:${gp}%"></div></div></div></div></div>`;
  });
  h+=`</div></div>`;
  const weak=kpData.filter(k=>k.classRate<0.65);
  if(weak.length>0){h+=`<div class="section"><div class="section__header"><span class="section__title">⚠️ 需重点加强</span></div><div class="tag-list">`;weak.forEach(k=>{h+=`<span class="tag" style="background:var(--color-warning-100);color:var(--color-warning-700);">${k.name}（${(k.classRate*100).toFixed(0)}%）</span>`;});h+=`</div></div>`;}
  return h;
}

// ===== Init =====
renderAll();
document.addEventListener('keydown',function(e){
  const tabs=['overview','analysis','review','essay','knowledge'];const idx=tabs.indexOf(currentTab);
  if(e.key==='ArrowRight'&&e.ctrlKey&&idx<tabs.length-1)switchTab(tabs[idx+1]);
  if(e.key==='ArrowLeft'&&e.ctrlKey&&idx>0)switchTab(tabs[idx-1]);
  if(e.key==='Escape')window.location.href='scan-progress.html';
});
